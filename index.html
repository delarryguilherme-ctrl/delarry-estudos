  vec2 q = abs(p - b.xy) - b.zw;
  float along = q.x > q.y ? p.y : p.x;
  float dash = smoothstep(0.12, 0.28, fract(along / 3.2)) * smoothstep(0.86, 0.7, fract(along / 3.2));
  float stitch = smoothstep(0.42, 0.12, abs(csd + 4.0)) * dash;
  h += 0.12 * stitch;
  float x0 = bookW() + uCoverPad * 0.32;                    // elástico vertical na borda direita
  float band_ = smoothstep(x0 - 0.3, x0 + 0.3, p.x) * smoothstep(x0 + 5.3, x0 + 4.7, p.x);
  h += 0.7 * band_;
  return vec4(h, peb, stitch, band_);
}
vec3 leatherColor(vec2 p, float e) {
  vec4 l0 = leatherH(p);
  vec2 g = vec2(leatherH(p + vec2(e, 0.0)).x - l0.x, leatherH(p + vec2(0.0, e)).x - l0.x) / e;
  Surf s;
  s.N = normalize(vec3(-g, 1.0)); s.Ns = s.N;
  vec3 base = vec3(0.021, 0.020, 0.019) * (1.0 + 0.3 * gnoise(p / 25.0));
  base = mix(base, vec3(0.055, 0.053, 0.05), l0.z);             // linha da costura
  base = mix(base, vec3(0.012), l0.w);
  s.alb = base;
  s.rough = mix(0.5 - 0.1 * l0.y, 0.3, l0.w);
  s.f0 = 0.045; s.sss = 0.0; s.z = 0.0;
  // as folhas apoiadas por cima fazem sombra de contato e projetam uma sombrinha
  vec2 toL = normalize(gLight.xy - p);
  float psd = pagesSD(p);
  float sh = 1.0 - smoothstep(-1.0, 1.8, pagesSD(p + toL * 1.6));
  s.ao = (1.0 - 0.55 * exp(-max(psd, 0.0) / 1.5)) * (1.0 - 0.55 * sh) * (0.85 + 0.15 * l0.y);
  Lit l = shade(s, p);
  return l.diff * s.ao + l.spec * mix(1.0, s.ao, 0.6) + l.amb;
}

vec3 toDisplay(vec3 c) {
  vec3 d = pow(aces(c * uWB * uExposure), vec3(1.0 / 2.2));
  return clamp((d - 0.5) * uContrast + 0.5, 0.0, 1.0);             // contraste em volta do meio-tom
}

void main() {
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 p  = (px - uOrigin) / uPxMm;           // mm, a partir do canto da primeira folha
  float e = 1.0 / uPxMm;

  // qual folha: a da direita tem a origem deslocada
  gRight = uPages > 1.5 && p.x > SHEET.x + uGap * 0.5;
  float off = gRight ? SHEET.x + uGap : 0.0;
  vec2 lp = p - vec2(off, 0.0);
  gLight = uLight - vec3(off, 0.0, 0.0);
  gEye = uEye - vec3(off, 0.0, 0.0);

  float sd = sheetSDF(lp);
  if (uTorn > 0.5) sd += (1.0 - smoothstep(4.0, 7.0, lp.x)) * 0.15 * gnoise(lp * vec2(1.0, 2.5));  // fiapos do rasgo
  float cover = clamp(0.5 - sd * uPxMm, 0.0, 1.0);

  vec3 col = uBg;
  if (cover < 1.0) {
    if (uCover > 0.5) {
      // capa: couro iluminado; fora dela, fundo branco com a sombra da capa
      vec3 L0 = gLight, E0 = gEye;
      gLight = uLight; gEye = uEye;
      float csd = coverSDF(p);
      vec2 toL = normalize(uLight.xy - p);
      float sh = 1.0 - smoothstep(-3.0, 5.0, coverSDF(p + toL * 3.5));
      col = uBg * (1.0 - 0.26 * sh - 0.10 * exp(-max(csd, 0.0) / 2.0));
      float cc = clamp(0.5 - csd * uPxMm, 0.0, 1.0);
      if (cc > 0.0) col = mix(col, toDisplay(leatherColor(p, e)), cc);
      gLight = L0; gEye = E0;
    } else {
      // folha solta no fundo branco sólido: sombra projetada e oclusão de contato
      float contact = exp(-max(sd, 0.0) / 1.2);
      float soft    = exp(-max(sd, 0.0) / 5.0);
      col *= 1.0 - 0.22 * castShadow(lp, sd) - 0.10 * contact - 0.03 * soft;
    }
  }
  if (cover > 0.0) col = mix(col, toDisplay(paperColor(lp, e, sd)), cover);
  col += (hash22(px).x - 0.5) / 255.0;                          // dither contra banding
  outColor = vec4(col, 1.0);
}`;

/* ------------------------------------------------------------------ *
 *  WebGL                                                              *
 * ------------------------------------------------------------------ */
let G, S, R = null;
// posição atual do abajur (suavizada) e do mouse, em mm a partir da primeira folha
const LS = { x: 0, y: 0, f: 0, init: false };
const mouse = { x: 0, y: 0, in: false };
function lightTarget() {
  const a = V.lightAngle * Math.PI / 180;
  const gapMM = S.gapDev / S.pxmmDev;
  const cx = (S.pages * MM.w + (S.pages - 1) * gapMM) / 2;
  const follow = V.sway && mouse.in;
  return follow ? { x: mouse.x, y: mouse.y, f: 1, cx }
                : { x: cx + Math.cos(a) * V.lightDist, y: MM.h / 2 + Math.sin(a) * V.lightDist, f: 0, cx };
}

function initGL() {
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false });
  if (!gl) return null;
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindVertexArray(gl.createVertexArray());
  const U = {};
  for (const n of ['uRes', 'uOrigin', 'uPxMm', 'uLight', 'uLightAxis', 'uPower', 'uEye', 'uInk0', 'uMedia0', 'uInk1', 'uMedia1',
                  'uPages', 'uGap', 'uCover', 'uCoverPad', 'uTorn', 'uHl0', 'uHl1', 'uBg',
                  'uLamp', 'uWB', 'uExposure', 'uContrast', 'uInkTint', 'uPaper', 'uBump', 'uCone', 'uStep', 'uLines', 'uRules', 'uMarginOn', 'uMarginX', 'uLine0'])
    U[n] = gl.getUniformLocation(prog, n);
  const makeTex = unit => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  };
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  const tex = [0, 1, 2, 3, 4, 5].map(makeTex);
  const blank = new Uint8Array(4);
  tex.forEach((t, i) => {
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, blank);
    gl.generateMipmap(gl.TEXTURE_2D);
  });
  gl.uniform1i(U.uInk0, 0); gl.uniform1i(U.uMedia0, 1);
  gl.uniform1i(U.uInk1, 2); gl.uniform1i(U.uMedia1, 3);
  gl.uniform1i(U.uHl0, 4); gl.uniform1i(U.uHl1, 5);
  return { gl, U, tex };
}

function upload(unit, source) {   // 0/1: tinta/mídia da esquerda, 2/3: da direita
  if (!R) return;
  const { gl, tex } = R;
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex[unit]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  gl.generateMipmap(gl.TEXTURE_2D);
}

function render() {
  if (!R) return render2D();
  const { gl, U } = R;
  // abajur: direção e distância medidas a partir do centro do caderno aberto
  const a = V.lightAngle * Math.PI / 180;
  const gapMM = S.gapDev / S.pxmmDev, padMM = S.coverDev / S.pxmmDev;
  const cx = (S.pages * MM.w + (S.pages - 1) * gapMM) / 2;
  if (!LS.init) { const t = lightTarget(); Object.assign(LS, { x: t.x, y: t.y, f: t.f, init: true }); }
  const lx = LS.x, ly = LS.y;
  // seguindo o mouse, o abajur desce um pouco para formar uma poça de luz visível sob o cursor
  const lz = V.lightHeight + (Math.min(V.lightHeight, 190) - V.lightHeight) * LS.f;
  const lamp = kelvinRGB(V.lightTemp);
  const cone = V.lightCone - 10 * LS.f;
  const coneOuter = Math.cos(Math.min(89, cone + 2) * Math.PI / 180);
  const coneInner = Math.cos(Math.max(1, cone - 37) * Math.PI / 180);
  // a cúpula mira o centro do caderno; seguindo o mouse, aponta para baixo de si mesma
  const tx = (cx - 5) + (lx - (cx - 5)) * LS.f, ty = 150 + (ly - 150) * LS.f;
  const ax = tx - lx, ay = ty - ly, az = -lz, al = Math.hypot(ax, ay, az);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform2f(U.uOrigin, S.padDev + S.coverDev, S.padDev + S.coverDev);
  gl.uniform1f(U.uPages, S.pages);
  gl.uniform1f(U.uGap, gapMM);
  gl.uniform1f(U.uCover, V.cover ? 1 : 0);
  gl.uniform1f(U.uCoverPad, padMM);
  gl.uniform1f(U.uTorn, V.cover ? 0 : 1);
  const bg = isDark() ? 18 / 255 : 1;
  gl.uniform3f(U.uBg, bg, bg, isDark() ? 17 / 255 : 1);
  gl.uniform1f(U.uPxMm, S.pxmmDev);
  gl.uniform3f(U.uLight, lx, ly, lz);
  gl.uniform3f(U.uLightAxis, ax / al, ay / al, az / al);
  gl.uniform1f(U.uPower, 3.0 * al * al * V.lightPower);
  gl.uniform3f(U.uLamp, ...lamp);
  gl.uniform3f(U.uWB, ...lamp.map(c => 1 + (1 / c - 1) * V.adapt));
  gl.uniform1f(U.uExposure, V.exposure);
  gl.uniform1f(U.uContrast, V.contrast);
  gl.uniform1f(U.uInkTint, 0.75 - 0.65 * V.inkDark);
  gl.uniform1f(U.uPaper, V.paperWhite);
  gl.uniform1f(U.uBump, V.relief);
  gl.uniform2f(U.uCone, coneOuter, coneInner);
  gl.uniform1f(U.uStep, MM.step);
  gl.uniform1f(U.uLines, MM.lines);
  gl.uniform1f(U.uRules, V.rules ? 1 : 0);
  gl.uniform1f(U.uMarginOn, V.margin ? 1 : 0);
  gl.uniform1f(U.uMarginX, MM.margin);
  gl.uniform1f(U.uLine0, MM.line0);
  // o cartão colado (DOM) recebe uma aproximação da mesma luz
  const tint = lamp.map(c => Math.round(255 * (1 - 0.1 * (1 - c))));
  document.documentElement.style.setProperty('--lamp-tint', `rgb(${tint.join(',')})`);
  document.documentElement.style.setProperty('--light-angle', `${V.lightAngle + 270}deg`);
  gl.uniform3f(U.uEye, cx, 148.5, 700);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// sem WebGL2: folha chapada, sem luz
function render2D() {
  const g = canvas.getContext('2d');
  const k = S.pxmmDev;
  g.fillStyle = isDark() ? '#121211' : '#fff'; g.fillRect(0, 0, canvas.width, canvas.height);
  if (V.cover) {
    g.fillStyle = '#1b1a19';
    g.fillRect(S.padDev, S.padDev, canvas.width - 2 * S.padDev, canvas.height - 2 * S.padDev);
  }
  for (const v of PV.slice(0, S.pages)) {
    g.save(); g.translate(S.padDev + S.coverDev + v.i * (v.ink.width + S.gapDev), S.padDev + S.coverDev);
    g.fillStyle = '#f7f5ef'; g.fillRect(0, 0, MM.w * k, MM.h * k);
    g.fillStyle = '#9cbbe0';
    for (let i = 0; i < MM.lines; i++) g.fillRect(0, (MM.line0 + i * MM.step) * k, MM.w * k, Math.max(1, 0.22 * k));
    g.fillStyle = '#e08a8f'; g.fillRect(MM.margin * k, 0, Math.max(1, 0.3 * k), MM.h * k);
    g.drawImage(v.hl, 0, 0);
    g.drawImage(v.media, 0, 0);
    g.drawImage(v.ink, 0, 0);
    g.restore();
  }
}

/* ------------------------------------------------------------------ *
 *  Layout da folha e do editor                                        *
 * ------------------------------------------------------------------ */
// letra, entrelinha e espaçamentos de uma coluna de texto (folha do livro ou texto contínuo)
function styleFlow(el, pxmmCss, scale, onRules) {
  const fs = V.fontSize * scale;
  const lh = MM.step * pxmmCss;
  const m = fontMetrics(`400 ${fs}px ${fam()}`);
  const mn = fontMetrics(`400 ${fs * 0.8}px ${fam()}`);
  const mc = fontMetrics(`400 ${fs * 0.85}px ${fam()}`);
  const inBox = (LH, mm) => (LH - (mm.ascent + mm.descent)) / 2 + mm.ascent;  // baseline dentro da linha
  // na folha, títulos e notas assentam a letra na mesma pauta do texto
  const shift = mm => (onRules ? inBox(lh, m) - inBox(lh, mm) : 0) + 'px';
  // títulos: tamanho em em (igual ao CSS); a letra grande ganha quantas linhas da pauta precisar
  for (const [tag, k] of [['h1', 2], ['h2', 1.6], ['h3', 1.3], ['h4', 1.08]]) {
    const mh = fontMetrics(`700 ${fs * k}px ${headFam()}`);
    // comparado com a letra do corpo (que já cabe numa linha): H1 e H2 ocupam duas, H3 e H4 uma
    const n = Math.max(1, Math.ceil((mh.ascent + mh.descent) / Math.max(lh, m.ascent + m.descent) - 0.35));
    el.style.setProperty(`--${tag}-lh`, n * lh + 'px');
    // baseline na última linha do bloco, sobre a mesma pauta do texto
    el.style.setProperty(`--${tag}-shift`, (onRules ? (n - 1) * lh + inBox(lh, m) - inBox(n * lh, mh) : 0) + 'px');
  }
  Object.assign(el.style, {
    fontSize: fs + 'px',
    lineHeight: lh + 'px',
    fontFamily: fontStack(V.font),
    letterSpacing: V.letter * scale + 'px',
  });
  el.style.setProperty('--indent', V.indent * pxmmCss + 'px');
  el.style.setProperty('--lh', lh + 'px');
  el.style.setProperty('--para', (V.paraSpace || 0) * lh + 'px');
  el.style.setProperty('--item-gap', (V.itemSpace || 0) * lh + 'px');
  el.style.setProperty('--paste-inset', figGap() * lh + 'px');
  el.style.setProperty('--list-pad', 7 * pxmmCss + 'px');
  el.style.setProperty('--note-shift', shift(mn));
  el.style.setProperty('--head-font', fontStack(headName()));
  el.style.setProperty('--crumb-shift', shift(mc));
  return { lh, top: inBox(lh, m) };
}

/* Texto contínuo: a mesma coluna da folha (mesmas letras por linha), sem papel e sem paginação. */
function layoutDoc() {
  const colW = (MM.x1 - MM.x0) * G.pxmm;
  const avail = Math.max(220, mainEl.clientWidth - 32);
  const k = Math.min(1, avail / colW);
  styleFlow(docEl, G.pxmm * k, k, false);
  docEl.style.width = colW * k + 'px';
  sizeFigures(docEl);
  for (const f of docEl.querySelectorAll('.embed')) fitEmbed(f);
}

function layout() {
  const avail = innerWidth;
  const gutter = avail < 700 ? 16 : 48;
  const padMM = V.cover ? 10 : 0, gapMM = V.cover ? 0 : 14;
  const wideMM = n => n * MM.w + (n - 1) * gapMM + 2 * padMM;
  let pages = V.pages === 2 ? 2 : 1;
  // o livro cabe inteiro na janela, entre o botão de fechar e a barra de páginas
  const fitW = n => (avail - 2 * gutter) / (wideMM(n) * G.pxmm);
  const fitH = (innerHeight - 124) / ((MM.h + 2 * padMM) * G.pxmm);
  let scale = Math.min(fitW(pages), fitH);
  if (pages === 2 && scale < 0.42) { pages = 1; scale = Math.min(fitW(1), fitH); }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  // as texturas de tinta e mídia casam pixel a pixel com o canvas
  const inkW = Math.round(MM.w * G.pxmm * scale * dpr);
  const pxmmDev = inkW / MM.w;
  const inkH = Math.round(MM.h * pxmmDev);
  const pxmmCss = pxmmDev / dpr;
  const sw = MM.w * pxmmCss, sh = MM.h * pxmmCss;
  const padDev = Math.round(PAD * dpr);
  const coverDev = Math.round(padMM * pxmmDev), gapDev = Math.round(gapMM * pxmmDev);
  const bookW = pages * inkW + (pages - 1) * gapDev + 2 * coverDev, bookH = inkH + 2 * coverDev;

  book.style.width = bookW / dpr + 'px';
  book.style.height = bookH / dpr + 'px';
  canvas.width = bookW + 2 * padDev;
  canvas.height = bookH + 2 * padDev;
  canvas.style.width = canvas.width / dpr + 'px';
  canvas.style.height = canvas.height / dpr + 'px';
  canvas.style.left = canvas.style.top = -padDev / dpr + 'px';
  PV.forEach((v, i) => {
    v.sheet.hidden = i >= pages;
    Object.assign(v.sheet.style, {
      left: (coverDev + i * (inkW + gapDev)) / dpr + 'px', top: coverDev / dpr + 'px', width: sw + 'px', height: sh + 'px',
    });
    v.ink.width = v.media.width = v.hl.width = inkW;
    v.ink.height = v.media.height = v.hl.height = inkH;
  });

  // folha: cada linha de texto cai exatamente sobre uma pauta
  const base0 = MM.line0 * pxmmCss - LIFT * scale;
  let lh = 0;
  for (const el of [...PV.map(v => v.editor), measure]) {
    const st = styleFlow(el, pxmmCss, scale, true);
    lh = st.lh;
    Object.assign(el.style, {
      left: MM.x0 * pxmmCss + 'px',
      width: (MM.x1 - MM.x0) * pxmmCss + 'px',
      top: base0 - st.top + 'px',
      height: MM.lines * lh + 'px',
    });
  }

  S = { scale, dpr, pxmmDev, pxmmCss, padDev, coverDev, gapDev, lh, pages };
  for (const v of PV) {
    sizeFigures(v.editor);
    for (const f of v.editor.querySelectorAll('.embed')) fitEmbed(f);
  }
  placeFlips();
}

function placeFlips() {
  const r = book.getBoundingClientRect();
  const room = r.left;
  for (const [btn, x] of [[$('flipPrev'), r.left - 72], [$('flipNext'), r.right + 24]]) {
    btn.hidden = room < 88;
    btn.style.left = x + 'px';
  }
}

/* ------------------------------------------------------------------ *
 *  Tinta: cada caractere desenhado onde o navegador o posicionou      *
 * ------------------------------------------------------------------ */
const hrand = (i, s) => {
  let x = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b) ^ s;
  x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
};
const strHash = s => { let x = 0; for (const c of s) x = Math.imul(x ^ c.charCodeAt(0), 16777619); return x; };

function drawCheckbox(g, x, y, sz, color, checked, seed) {
  const j = () => (hrand(seed++, 7) - 0.5) * sz * 0.12;
  g.save();
  g.strokeStyle = color; g.lineWidth = Math.max(0.9, sz * 0.1); g.lineJoin = 'round'; g.lineCap = 'round'; g.globalAlpha = 0.95;
  g.beginPath();
  g.moveTo(x + j(), y + j());
  g.lineTo(x + sz + j(), y + j());
  g.lineTo(x + sz + j(), y + sz + j());
  g.lineTo(x + j(), y + sz + j());
  g.closePath();
  g.stroke();
  if (checked) {
    g.lineWidth = Math.max(1.1, sz * 0.15);
    g.beginPath();
    g.moveTo(x + sz * 0.18, y + sz * 0.52);
    g.quadraticCurveTo(x + sz * 0.32, y + sz * 0.7, x + sz * 0.42, y + sz * 0.86);
    g.quadraticCurveTo(x + sz * 0.7, y + sz * 0.3, x + sz * 1.08, y - sz * 0.18);
    g.stroke();
  }
  g.restore();
}

function drawMarker(g, x, y, w, hh, color, seed) {
  const top = y + hh * 0.2, bot = y + hh * 0.88, j = hh * 0.06;
  g.fillStyle = color;
  g.globalAlpha = 0.9;
  g.beginPath();
  g.moveTo(x - 2, top + (hrand(seed, 11) - 0.5) * j * 2);
  g.lineTo(x + w + 2, top + (hrand(seed, 12) - 0.5) * j * 2);
  g.lineTo(x + w + 3, bot + (hrand(seed, 13) - 0.5) * j * 2);
  g.lineTo(x - 1, bot + (hrand(seed, 14) - 0.5) * j * 2);
  g.closePath();
  g.fill();
  g.globalAlpha = 1;
}

function wobbleLine(g, x0, x1, y, seed, amp) {
  const dx = x1 - x0;
  g.beginPath();
  g.moveTo(x0, y + (hrand(seed, 1) - 0.5) * amp);
  g.bezierCurveTo(x0 + dx * 0.33, y + (hrand(seed, 2) - 0.5) * 2 * amp,
                  x0 + dx * 0.66, y + (hrand(seed, 3) - 0.5) * 2 * amp,
                  x1, y + (hrand(seed, 4) - 0.5) * amp);
  g.stroke();
}

function rasterizeInk(v) {
  const { editor, sheet } = v;
  const g = v.ink.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, v.ink.width, v.ink.height);
  const hg = v.hl.getContext('2d');
  hg.setTransform(1, 0, 0, 1, 0, 0);
  hg.clearRect(0, 0, v.hl.width, v.hl.height);
  hg.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  g.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  g.textBaseline = 'alphabetic'; g.lineCap = 'round'; g.lineJoin = 'round';

  const o = sheet.getBoundingClientRect();
  const range = document.createRange();
  const decoCache = new Map();
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('.media, .embed, .audio') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  let idx = 0;

  for (let node; (node = walker.nextNode());) {
    const el = node.parentElement;
    const cs = getComputedStyle(el);
    const size = parseFloat(cs.fontSize);
    const inHead = !!el.closest('h1, h2, h3, h4');
    const font = `${cs.fontStyle} ${cs.fontWeight} ${size}px ${el.closest('code') ? cs.fontFamily : inHead ? headFam() : fam()}`;
    const { ascent } = fontMetrics(font);
    g.font = font;
    g.fillStyle = g.strokeStyle = cs.color;

    const text = node.data;
    for (let i = 0; i < text.length;) {
      const n = text.codePointAt(i) > 0xffff ? 2 : 1;
      const ch = text.slice(i, i + n);
      if (!/\s/.test(ch)) {
        range.setStart(node, i); range.setEnd(node, i + n);
        const rs = range.getClientRects();
        const r = rs[rs.length - 1];
        if (r && r.width > 0) {
          const shake = fontKind(inHead ? headName() : V.font) === 'hand' ? 1 : 0.15;
          const s = 1 + (hrand(idx, 3) - 0.5) * 0.05 * shake;
          g.save();
          g.translate(r.left - o.left, r.top - o.top + ascent + (hrand(idx, 1) - 0.5) * 0.7 * S.scale * shake);
          g.rotate((hrand(idx, 2) - 0.5) * 0.05 * shake);
          g.scale(s, s);
          g.globalAlpha = 0.93 + hrand(idx, 4) * 0.07;
          g.fillText(ch, 0, 0);
          g.restore();
        }
      }
      i += n; idx++;
    }

    // marca-texto: o fundo inline mais próximo manda ("transparent" = desmarcado)
    let hlc = '';
    for (let e = el; e && e !== editor; e = e.parentElement) {
      const bg = e.style?.backgroundColor;
      if (bg) { if (bg !== 'transparent' && !/,\s*0\)$/.test(bg)) hlc = bg; break; }
    }
    if (hlc) {
      range.selectNodeContents(node);
      for (const r of range.getClientRects()) if (r.width >= 1) drawMarker(hg, r.left - o.left, r.top - o.top, r.width, r.height, hlc, idx);
    }

    // sublinhado e riscado à mão
    let u = false, st = false;
    for (let e = el; e; e = e.parentElement) {
      let d = decoCache.get(e);
      if (d === undefined) { d = getComputedStyle(e).textDecorationLine; decoCache.set(e, d); }
      if (d.includes('underline')) u = true;
      if (d.includes('line-through')) st = true;
      if (e === editor) break;
    }
    if (u || st) {
      range.selectNodeContents(node);
      g.globalAlpha = 0.95;
      g.lineWidth = Math.max(0.8, size * 0.07);
      let j = 0;
      for (const r of range.getClientRects()) {
        if (r.width < 1) continue;
        const base = r.top - o.top + ascent;
        const x0 = r.left - o.left - 1.5, x1 = r.right - o.left + 1.5;
        if (u) wobbleLine(g, x0, x1, base + size * 0.17, idx * 7 + j, 1.1 * S.scale);
        if (st) {
          wobbleLine(g, x0, x1, base - size * 0.28, idx * 7 + j + 3, 1.2 * S.scale);
          wobbleLine(g, x1 - 1, x0 + 2, base - size * 0.33, idx * 7 + j + 5, 1.4 * S.scale);
        }
        j++;
      }
      g.globalAlpha = 1;
    }
  }

  // marcadores de lista (o ::marker nativo fica transparente)
  for (const li of editor.querySelectorAll('li')) {
    const list = li.parentElement;
    const cs = getComputedStyle(li);
    const size = parseFloat(cs.fontSize);
    const font = `400 ${size}px ${fam()}`;
    const mm = fontMetrics(font);
    const r = li.getBoundingClientRect();
    const lh = parseFloat(cs.lineHeight);
    const base = r.top - o.top + (lh - (mm.ascent + mm.descent)) / 2 + mm.ascent;
    if (list.classList.contains('checklist')) {
      drawCheckbox(g, r.left - o.left - size * 1.35, base - size * 0.68, size * 0.7, cs.color, li.dataset.checked === 'true',
                   strHash(li.textContent.slice(0, 24)) ^ Math.round(r.top));
      continue;
    }
    const label = list.tagName === 'OL' ? `${(list.start || 1) + [...list.children].indexOf(li)}.` : '•';
    g.font = font; g.fillStyle = cs.color;
    g.fillText(label, r.left - o.left - g.measureText(label).width - size * 0.45, base);
  }
  // divisor e barra da citação, também à caneta
  g.lineCap = 'round';
  for (const hr of editor.querySelectorAll('hr')) {
    const r = hr.getBoundingClientRect();
    g.strokeStyle = getComputedStyle(hr).color;
    g.lineWidth = Math.max(0.8, 1.2 * S.scale);
    g.globalAlpha = 0.92;
    const y = r.top - o.top + r.height / 2;
    // de borda a borda da folha, com uma folguinha de mão
    wobbleLine(g, 3 * S.pxmmCss, o.width - 3 * S.pxmmCss, y, Math.round(y), 2.2 * S.scale);
  }
  for (const bq of editor.querySelectorAll('blockquote')) {
    const r = bq.getBoundingClientRect();
    const x = r.left - o.left + 2 * S.pxmmCss;
    const y0 = r.top - o.top + S.lh * 0.25, y1 = r.bottom - o.top - S.lh * 0.2;
    g.strokeStyle = getComputedStyle(bq).color;
    g.lineWidth = Math.max(0.9, 1.3 * S.scale);
    g.globalAlpha = 0.92;
    g.beginPath();
    g.moveTo(x, y0);
    g.bezierCurveTo(x - 0.8 * S.scale, y0 + (y1 - y0) * 0.35, x + 0.9 * S.scale, y0 + (y1 - y0) * 0.7, x - 0.3 * S.scale, y1);
    g.stroke();
  }
  // tabela: grade à mão, com traço duplo sob o cabeçalho
  for (const t of editor.querySelectorAll('table.tbl')) {
    const rows = [...t.rows];
    if (!rows.length) continue;
    const tr = t.getBoundingClientRect();
    const x0 = tr.left - o.left, x1 = tr.right - o.left;
    const ys = [rows[0].getBoundingClientRect().top - o.top, ...rows.map(r => r.getBoundingClientRect().bottom - o.top)];
    const seed = Math.round(tr.top);
    g.strokeStyle = getComputedStyle(t).color;
    g.lineWidth = Math.max(0.7, 1.05 * S.scale);
    g.globalAlpha = 0.9;
    ys.forEach((y, k) => wobbleLine(g, x0, x1, y, seed + k * 13, 1.1 * S.scale));
    const head = t.dataset.head === '1' && rows.length > 1 || rows[0].hasAttribute('data-rep');
    if (head) wobbleLine(g, x0, x1, ys[1] + 1.6 * S.scale, seed + 7, 0.9 * S.scale);
    const xs = [x0, ...[...rows[0].cells].slice(1).map(c => c.getBoundingClientRect().left - o.left), x1];
    xs.forEach((x, k) => {
      const y0 = ys[0], y1 = ys[ys.length - 1], dy = y1 - y0, a = 1.1 * S.scale;
      g.beginPath();
      g.moveTo(x + (hrand(seed + k, 21) - 0.5) * a, y0);
      g.bezierCurveTo(x + (hrand(seed + k, 22) - 0.5) * 2 * a, y0 + dy * 0.33, x + (hrand(seed + k, 23) - 0.5) * 2 * a, y0 + dy * 0.66,
                      x + (hrand(seed + k, 24) - 0.5) * a, y1);
      g.stroke();
    });
  }
  g.globalAlpha = 1;
  upload(v.i * 2, v.ink);
  upload(4 + v.i, v.hl);
}

/* Fotos e vídeos: impressos numa textura que o shader trata como papel fotográfico colado. */
function rasterizeMedia(v) {
  const { editor, sheet } = v;
  const g = v.media.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, v.media.width, v.media.height);
  g.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  const o = sheet.getBoundingClientRect();
  for (const f of editor.querySelectorAll('.media')) {
    const r = f.getBoundingClientRect();
    // a foto mantém a proporção e fica centralizada no bloco; a sobra é o respiro configurado
    const room = Math.max(1, r.height - 2 * figGap() * S.lh);
    const aspect = +f.dataset.aspect || r.width / room;
    const hh = Math.min(room, r.width / aspect);           // se faltar altura, a foto diminui um pouco (sem distorcer)
    const w = Math.min(r.width, hh * aspect);
    const x = r.left - o.left + (r.width - w) / 2, y = r.top - o.top + (r.height - hh) / 2;
    const b = Math.max(2, 0.9 * S.pxmmCss);         // borda branca da foto
    const src = f.querySelector('.src');
    const tilt = (hrand(strHash(f.dataset.media || ''), 9) - 0.5) * 0.02;
    g.save();
    g.translate(x + w / 2, y + hh / 2); g.rotate(tilt); g.translate(-w / 2, -hh / 2);
    g.fillStyle = '#fbfaf7'; g.fillRect(0, 0, w, hh);
    // GIF: quadro do momento, decodificado à parte (o <img> escondido não anima)
    const anim = f.dataset.anim === '1' ? animFrame(f.dataset.media) : null;
    const pic = anim || src;
    const sw = anim?.width || src?.naturalWidth || src?.videoWidth || 0, shh = anim?.height || src?.naturalHeight || src?.videoHeight || 0;
    const ready = anim || (src && sw && (src.tagName === 'IMG' ? src.complete : src.readyState >= 2));
    const dw = w - 2 * b, dh = hh - 2 * b;
    if (ready && dw > 0 && dh > 0) {
      const k = Math.max(dw / sw, dh / shh);
      const cw = dw / k, chh = dh / k;
      g.drawImage(pic, (sw - cw) / 2, (shh - chh) / 2, cw, chh, b, b, dw, dh);
    } else {
      g.fillStyle = '#dcd9d2'; g.fillRect(b, b, Math.max(0, dw), Math.max(0, dh));
    }
    g.restore();
  }
  for (const f of editor.querySelectorAll('.embed')) {
    const r = f.getBoundingClientRect(), inset = figGap() * S.lh;
    const x = r.left - o.left, y = r.top - o.top + inset, w = r.width, hh = r.height - 2 * inset;
    const tilt = embedTilt(f) * Math.PI / 180;
    g.save();
    g.translate(x + w / 2, y + hh / 2); g.rotate(tilt);
    g.fillStyle = '#fffefb'; g.fillRect(-w / 2, -hh / 2, w, hh);
    g.restore();
  }
  upload(v.i * 2 + 1, v.media);
}

/* ------------------------------------------------------------------ *
 *  Agendamento                                                        *
 * ------------------------------------------------------------------ */
let queued = false;
const dirty = { layout: false, ink: false, media: false };
function request(flags = {}) {
  for (const k in flags) if (flags[k]) dirty[k] = true;
  if (!queued) { queued = true; requestAnimationFrame(frame); }
}
const playingVideos = () => PV.some(p => [...p.editor.querySelectorAll('video')].some(v => !v.paused && !v.ended));
const animatedImages = () => shownViews().some(v => v.editor.querySelector('.media[data-anim="1"] img.src'));
let lastAnim = 0, animT = 0;
function frame() {
  queued = false;
  if (!G || !BOOK.open) return;                 // fechado, o livro não é desenhado
  if (dirty.layout) {
    const before = S?.pages;
    layout();
    dirty.layout = false; dirty.ink = dirty.media = true;
    if (before && lib && before !== S.pages) loadPage(curPage);   // passou de uma para duas folhas (ou vice-versa)
  }
  const shown = PV.slice(0, S.pages);
  if (dirty.ink) { shown.forEach(rasterizeInk); dirty.ink = false; }
  const playing = playingVideos();
  const gifs = !playing && animatedImages();
  const now = performance.now();
  if (dirty.media || playing || (gifs && now - lastAnim > 60)) { shown.forEach(rasterizeMedia); dirty.media = false; lastAnim = now; }
  const t = lightTarget();
  if (!LS.init) Object.assign(LS, { x: t.x, y: t.y, f: t.f, init: true });
  LS.x += (t.x - LS.x) * 0.16; LS.y += (t.y - LS.y) * 0.16; LS.f += (t.f - LS.f) * 0.16;
  render();
  if (playing || Math.abs(t.x - LS.x) + Math.abs(t.y - LS.y) + Math.abs(t.f - LS.f) > 0.05) request();
  else if (gifs) { clearTimeout(animT); animT = setTimeout(() => request(), 66); }   // GIF: ~15 quadros por segundo bastam
}

/* ------------------------------------------------------------------ *
 *  Armazenamento (IndexedDB: biblioteca + arquivos de mídia)          *
 * ------------------------------------------------------------------ */
const Store = (() => {
  let db = null;
  const open = () => new Promise(res => {
    try {
      // banco novo: os cadernos agora são texto contínuo (o banco antigo, 'folha-caderno', fica intocado)
      const r = indexedDB.open('delarry-estudos', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('media'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch { res(null); }
  });
  const op = (store, mode, fn) => new Promise((res, rej) => {
    if (!db) return res(undefined);
    const tx = db.transaction(store, mode);
    const q = fn(tx.objectStore(store));
    tx.oncomplete = () => res(q?.result);
    tx.onerror = tx.onabort = () => rej(tx.error);
  });
  return {
    // banco preso (ex.: outra aba segurando uma conexão) não pode impedir o caderno de abrir
    async init() { db = await Promise.race([open(), new Promise(r => setTimeout(() => r(null), 3000))]); return !!db; },
    getLib: () => op('kv', 'readonly', s => s.get('library')),
    // as páginas do livro são montadas na hora; só o texto é guardado
    putLib: lib => op('kv', 'readwrite', s => s.put({ ...lib, notebooks: lib.notebooks.map(({ pages, ...n }) => n) }, 'library')),
    getKV: key => op('kv', 'readonly', s => s.get(key)),
    putKV: (key, val) => op('kv', 'readwrite', s => s.put(val, key)),
    getMedia: id => op('media', 'readonly', s => s.get(id)),
    putMedia: (id, blob) => op('media', 'readwrite', s => s.put(blob, id)),
    delMedia: id => op('media', 'readwrite', s => s.delete(id)),
    mediaKeys: () => op('media', 'readonly', s => s.getAllKeys()),
    delKV: key => op('kv', 'readwrite', s => s.delete(key)),
    // sair da conta: o aparelho volta a ficar limpo
    wipe: async () => { await op('kv', 'readwrite', s => s.clear()); await op('media', 'readwrite', s => s.clear()); },
  };
})();

const memBlobs = new Map(), mediaUrls = new Map(), mediaTypes = new Map();
const ANIMATED = /^image\/(gif|apng|webp)$/i;
/* Quadros de GIF/APNG/WebP animado, decodificados uma vez (WebCodecs ImageDecoder). */
const animCache = new Map();
async function decodeAnim(id) {
  if (animCache.has(id) || !('ImageDecoder' in window)) return;
  animCache.set(id, null);
  try {
    const blob = memBlobs.get(id) || await Store.getMedia(id);
    if (!blob || !(await ImageDecoder.isTypeSupported(blob.type))) return;
    const dec = new ImageDecoder({ data: await blob.arrayBuffer(), type: blob.type });
    await dec.tracks.ready;
    const count = Math.min(dec.tracks.selectedTrack.frameCount || 1, 400);
    const frames = [];
    let total = 0;
    for (let i = 0; i < count; i++) {
      const { image } = await dec.decode({ frameIndex: i });
      const dur = Math.max(20, (image.duration || 100000) / 1000);   // µs → ms
      frames.push({ bmp: await createImageBitmap(image), dur, at: total });
      total += dur;
      image.close();
    }
    dec.close();
    if (frames.length > 1) { animCache.set(id, { frames, total }); request({ media: true }); }
  } catch (err) { console.warn('GIF', err); }
}
function animFrame(id) {
  const a = animCache.get(id);
  if (a === undefined) { decodeAnim(id); return null; }
  if (!a) return null;
  const t = performance.now() % a.total;
  let fr = a.frames[0];
  for (const x of a.frames) { if (x.at <= t) fr = x; else break; }
  return fr.bmp;
}
async function mediaUrl(id) {
  if (mediaUrls.has(id)) return mediaUrls.get(id);
  let blob = memBlobs.get(id) || await Store.getMedia(id).catch(() => null);
  if (!blob) blob = await Sync.fetchMedia(id);     // logado: busca na conta
  if (!blob) return null;
  mediaTypes.set(id, blob.type);
  const u = URL.createObjectURL(blob);
  mediaUrls.set(id, u);
  return u;
}

let lib, saveT;
const nb = () => lib.notebooks.find(n => n.id === lib.current);
const folder = id => lib.folders.find(f => f.id === id);
const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(() => Store.putLib(lib).catch(console.error), 400); Sync.schedule(); };

function defaultLibrary() {
  const f = { id: uid(), name: 'Pessoal', parentId: null, open: true };
  const n = { id: uid(), name: 'Primeiros passos', folderId: f.id, html: DEFAULT_HTML, editing: false, updated: Date.now() };
  return { version: 2, folders: [f], notebooks: [n], current: n.id, selectedFolder: f.id };
}
function ensureCurrent() {

/* ------------------------------------------------------------------ *
 *  Texto do caderno: carregar e salvar                                *
 * ------------------------------------------------------------------ */
// salva só a "casca" das fotos/vídeos (o arquivo fica no IndexedDB)
function serialize(root, keepCaret = false) {
  const c = root.cloneNode(true);
  for (const f of c.querySelectorAll('.media, .embed, .audio')) { f.replaceChildren(); f.removeAttribute('style'); f.removeAttribute('contenteditable'); }
  for (const b of c.querySelectorAll('nav.crumbs')) { b.replaceChildren(); b.removeAttribute('contenteditable'); }   // o caminho é montado na hora
  for (const a of c.querySelectorAll('a[title]')) a.removeAttribute('title');
  for (const td of c.querySelectorAll('td.cur')) { td.classList.remove('cur'); if (!td.classList.length) td.removeAttribute('class'); }
  if (!keepCaret) for (const m of c.querySelectorAll('[data-caret]')) m.remove();
  return c.innerHTML;
}

const shownViews = () => PV.slice(0, S?.pages || 1);
const spreadStart = i => (S?.pages === 2 ? i - (i % 2) : i);

// grava o texto; "auto" = ajuste feito pelo próprio app (não conta como edição do arquivo importado)
function commitDoc(auto = false) {
  const n = nb();
  if (!n || docEl.dataset.nb !== n.id) return;
  const html = serialize(docEl);
  if (n.html === html) return;
  n.html = html;
  n.updated = Date.now();
  if (!auto && n.source) n.source.dirty = true;
  saveSoon();
}
function commitView(v) { if (v?.isDoc) commitDoc(); }
function commitPage() { commitDoc(); }

function pauseVideos(root = null) {
  for (const r of root ? [root] : [docEl, ...PV.map(v => v.editor)]) for (const vd of r.querySelectorAll('video, audio')) vd.pause();
}

function loadDoc({ keepScroll = false } = {}) {
  const n = nb();
  if (!n) return;
  clearBlockSel();
  pauseVideos(docEl);
  docEl.innerHTML = n.html || EMPTY_PAGE;
  if (!docEl.firstElementChild) docEl.innerHTML = EMPTY_PAGE;
  docEl.dataset.nb = n.id;
  const stray = hasStrayStyles(docEl);
  if (stray) cleanInlineStyles(docEl);            // conserta cadernos que já pegaram o texto gigante
  layoutDoc();
  hydrateFigures(docEl);
  if (stray) commitDoc(true);
  activate(DV);
  updatePager();
  if (!keepScroll) scrollTo(0, 0);
}

function loadView(v, idx) {
  const n = nb();
  v.page = idx;
  v.editor.innerHTML = n.pages[idx] || EMPTY_PAGE;
  if (!v.editor.firstElementChild) v.editor.innerHTML = EMPTY_PAGE;
  hydrateFigures(v.editor);
}

/* Virada de página: fotografa a(s) folha(s) antes e depois e gira uma folha em 3D presa na lombada. */
function renderNow() {
  if (dirty.layout || !S || !BOOK.open) return;
  for (const v of shownViews()) { rasterizeInk(v); rasterizeMedia(v); }
  dirty.ink = dirty.media = false;
  render();
}
function snapshot(v) {
  const c = document.createElement('canvas');
  c.width = v.ink.width; c.height = v.ink.height;
  const sx = S.padDev + S.coverDev + v.i * (v.ink.width + S.gapDev), sy = S.padDev + S.coverDev;
  c.getContext('2d').drawImage(canvas, sx, sy, c.width, c.height, 0, 0, c.width, c.height);
  return c;
}
// verso da folha: papel com a pauta e a tinta do outro lado aparecendo de leve
function verso(c) {
  const o = document.createElement('canvas');
  o.width = c.width; o.height = c.height;
  const g = o.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1);
  g.drawImage(c, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const px = c.getContext('2d').getImageData(Math.floor(c.width * 0.92), Math.floor(c.height * 0.03), 1, 1).data;
  g.globalAlpha = 0.93;
  g.fillStyle = `rgb(${px[0]},${px[1]},${px[2]})`;
  g.fillRect(0, 0, o.width, o.height);
  return o;
}
let flipping = null;
function playFlip(dir, before, after) {
  flipping?.finish();
  const spread = S.pages === 2;
  const els = [];
  const place = (v, el) => {
    const st = v.sheet.style;
    Object.assign(el.style, { left: st.left, top: st.top, width: st.width, height: st.height });
    book.append(el);
    els.push(el);
    return el;
  };
  const face = (c, back) => h('div', { class: 'face' + (back ? ' back' : '') }, c, h('div', { class: 'face-shade' }));
  let leafView, front, back, from, to, origin;
  if (!spread) {
    leafView = PV[0]; origin = 'left center';
    if (dir > 0) { front = before[0]; back = verso(before[0]); from = 0; to = -180; }
    else { place(PV[0], h('div', { class: 'leaf-still' }, before[0])); front = after[0]; back = verso(after[0]); from = -180; to = 0; }
  } else if (dir > 0) {
    place(PV[0], h('div', { class: 'leaf-still' }, before[0]));
    leafView = PV[1]; front = before[1]; back = after[0]; from = 0; to = -180; origin = 'left center';
  } else {
    place(PV[1], h('div', { class: 'leaf-still' }, before[1]));
    leafView = PV[0]; front = before[0]; back = after[1]; from = 0; to = 180; origin = 'right center';
  }
  const shadowView = !spread ? PV[0] : (dir > 0 ? PV[1] : PV[0]);
  const shadow = place(shadowView, h('div', { class: 'leaf-shadow' }));
  shadow.style.background = `linear-gradient(${origin.startsWith('left') ? 'to right' : 'to left'}, rgba(20, 14, 8, .32), rgba(20, 14, 8, 0) 75%)`;
  const leaf = place(leafView, h('div', { class: 'leaf' }, face(front), face(back, true)));
  leaf.style.transformOrigin = origin;

  const D = 860, easing = 'cubic-bezier(.45, .05, .3, 1)';
  const mid = (from + to) / 2;
  let frames = [
    { transform: `rotateY(${from}deg)`, offset: 0 },
    { transform: `rotateY(${mid}deg) translateZ(22px)`, offset: 0.5 },
    { transform: `rotateY(${to}deg)`, offset: 1 },
  ];
  if (!spread) {   // folha única: some/aparece do lado de fora da capa
    frames = dir > 0
      ? [{ ...frames[0], opacity: 1 }, frames[1], { opacity: 1, offset: 0.78 }, { ...frames[2], opacity: 0 }]
      : [{ ...frames[0], opacity: 0 }, { opacity: 1, offset: 0.22 }, frames[1], { ...frames[2], opacity: 1 }];
  }
  const shade = flat => [{ opacity: flat ? 0 : 0.45 }, { opacity: 0.45, offset: 0.5 }, { opacity: flat ? 0.45 : 0 }];
  const [fs, bs] = leaf.querySelectorAll('.face-shade');
  const anims = [
    leaf.animate(frames, { duration: D, easing, fill: 'forwards' }),
    fs.animate(shade(from === 0), { duration: D, easing, fill: 'forwards' }),
    bs.animate(shade(Math.abs(from) === 180), { duration: D, easing, fill: 'forwards' }),
    shadow.animate([{ opacity: 0 }, { opacity: 1, offset: 0.45 }, { opacity: 0 }], { duration: D, easing, fill: 'forwards' }),
  ];
  let done = false;
  const cleanup = () => { if (done) return; done = true; els.forEach(e => e.remove()); if (flipping?.leaf === leaf) flipping = null; };
  anims[0].finished.then(cleanup, cleanup);
  flipping = { leaf, finish: () => { anims.forEach(a => a.cancel()); cleanup(); } };
}

// mostra a página i do livro (e a vizinha, com duas folhas abertas)
function loadPage(i, { dir = 0 } = {}) {
  const n = nb();
  if (!n?.pages) return;
  const animate = dir && V.flip && R && S && !dirty.layout;
  let before = null;
  if (animate) { renderNow(); before = shownViews().map(snapshot); }
  pauseVideos();
  i = clamp(i, 0, n.pages.length - 1);
  const start = spreadStart(i);
  const views = shownViews();
  views.forEach((v, k) => loadView(v, start + k));
  activate(views[i - start] || views[0]);
  updatePager();
  request({ ink: true, media: true });
  if (animate) { renderNow(); playFlip(dir, before, shownViews().map(snapshot)); }
}

function goPage(i) {
  if (TTS.on && !TTS.auto) ttsStop();
  const n = nb();
  if (!BOOK.open || i < 0 || i >= n.pages.length || i === curPage) return;
  const v = shownViews().find(x => x.page === i);
  if (v) { activate(v); updatePager(); return; }   // já está aberta
  loadPage(i, { dir: Math.sign(i - curPage) });
}

/* ------------------------------------------------------------------ *
 *  Paginação automática: o texto é cortado em folhas pelo tamanho     *
 * ------------------------------------------------------------------ */
const limitOf = root => root.getBoundingClientRect().top + MM.lines * S.lh;
function overflows(root) {
  const last = root.lastElementChild;
  return !!last && last.getBoundingClientRect().bottom > limitOf(root) + 1;
}

// parágrafo: corta na primeira linha que passa da última pauta
function splitParagraph(block, limit) {
  const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
  const range = document.createRange();
  let first = true;
  for (let n; (n = walker.nextNode());) {
    for (let i = 0; i < n.length; i++) {
      if (/\s/.test(n.data[i])) continue;
      range.setStart(n, i); range.setEnd(n, i + 1);
      const rs = range.getClientRects();
      const r = rs[rs.length - 1];
      if (!r) continue;
      if ((r.top + r.bottom) / 2 > limit) {
        if (first) return null;                       // nem a primeira linha cabe: vai inteiro
        range.setStart(n, i);
        range.setEnd(block, block.childNodes.length);
        const tail = block.cloneNode(false);
        tail.classList.add('cont');                   // continuação: sem recuo de parágrafo
        tail.append(range.extractContents());
        return tail;
      }
      first = false;
    }
  }
  return null;
}
function splitList(list, limit) {
  const items = [...list.children];
  const j = items.findIndex(li => li.getBoundingClientRect().bottom > limit);
  if (j <= 0) return null;
  const tail = list.cloneNode(false);
  if (list.tagName === 'OL') tail.start = (list.start || 1) + j;
  tail.append(...items.slice(j));
  return tail;
}
// tabela: as linhas que não cabem continuam na folha seguinte, repetindo o cabeçalho
function splitTable(table, limit) {
  const rows = [...table.rows];
  const head = table.dataset.head === '1' ? rows[0] : null;
  const j = rows.findIndex(r => r.getBoundingClientRect().bottom > limit);
  if (j <= (head ? 1 : 0)) return null;
  const tail = table.cloneNode(false);
  const body = document.createElement('tbody');
  if (head) { const rep = head.cloneNode(true); rep.dataset.rep = '1'; body.append(rep); }
  body.append(...rows.slice(j));
  tail.append(body);
  tail.dataset.head = '0';
  return tail;
}

// tira de root o que não cabe na folha e devolve como fragmento
function cutOverflow(root) {
  if (!overflows(root)) return null;
  const limit = limitOf(root) + 1;
  const kids = [...root.children];
  let i = kids.findIndex(k => k.getBoundingClientRect().bottom > limit);
  if (i < 0) return null;
  const block = kids[i];
  let tail = null;
  if (block.getBoundingClientRect().top < limit - 2) {
    if (/^(P|BLOCKQUOTE|ASIDE)$/.test(block.tagName)) tail = splitParagraph(block, limit);
    else if (block.tagName === 'UL' || block.tagName === 'OL') tail = splitList(block, limit);
    else if (block.tagName === 'TABLE') tail = splitTable(block, limit);
  }
  // título não fica sozinho no pé da folha: desce junto com o que vem depois
  if (!tail && i > 1 && /^H[1-4]$/.test(kids[i - 1].tagName)) i--;
  if (!tail && i === 0) {
    if (kids.length < 2) return null;                 // um bloco maior que a folha: fica sozinho nela
    i = 1;
  }
  const frag = document.createDocumentFragment();
  if (tail) { frag.append(tail); i++; }
  for (const k of kids.slice(i)) frag.append(k);
  pauseVideos(frag);
  return frag;
}

const isEmptyBlock = el => !!el && el.tagName === 'P' && !el.textContent.trim() && !el.querySelector('.media, .embed, .audio, hr, [data-caret]');

// monta as páginas do livro a partir do texto, medindo numa folha invisível
function paginate(html) {
  measure.innerHTML = html;
  const pages = [];
  for (let guard = 0; guard < 5000; guard++) {
    // linhas em branco no alto da folha são só espaço perdido
    while (measure.children.length > 1 && isEmptyBlock(measure.firstElementChild) && pages.length) measure.firstElementChild.remove();
    sizeFigures(measure);
    const frag = cutOverflow(measure);
    pages.push(serialize(measure) || EMPTY_PAGE);
    if (!frag) break;
    measure.replaceChildren(frag);
  }
  measure.innerHTML = '';
  return pages.length ? pages : [EMPTY_PAGE];
}

/* ------------------------------------------------------------------ *
 *  Livro: tela cheia, só leitura, sempre começa na primeira página    *
 * ------------------------------------------------------------------ */
function openBook() {
  const n = nb();
  if (!n || BOOK.open || FV.id) return;
  commitDoc();
  clearBlockSel(); closeSlash(); hideTblPop();
  if (!$('linkPop').hidden) closeLinkPop(false);
  ttsStop();
  pauseVideos(docEl);
  BOOK.scroll = scrollY;
  BOOK.open = true;
  $('reader').hidden = false;
  document.documentElement.classList.add('reading');
  layout();
  dirty.layout = false;
  n.pages = paginate(n.html);

}
function closeBook() {
  if (!BOOK.open) return;
  ttsStop();
  flipping?.finish();
  pauseVideos();
  BOOK.open = false;
  $('reader').hidden = true;
  document.documentElement.classList.remove('reading');
  for (const v of PV) v.editor.replaceChildren();
  const n = nb();
  if (n) delete n.pages;
  activate(DV);
  loadDoc({ keepScroll: true });       // traz as caixinhas marcadas no livro
  scrollTo(0, BOOK.scroll);
  syncViewPanel();
  $('bookBtn').focus({ preventScroll: true });
}

/* O Chrome, ao juntar um título com um parágrafo (Backspace/Delete), embrulha o texto em
   <span style="font-size: 32px; font-weight: 700…"> para "manter a aparência", e o parágrafo
   fica com letra de título. Aqui só sobram os estilos que o app usa de propósito:
   marca-texto (background-color) e alinhamento dos blocos. */
const KEEP_INLINE = new Set(['background-color']);
const hasStrayStyles = root => [...root.querySelectorAll('[style], font[size], font[face], span:not([class]):not([style]):not([data-caret])')]
  .some(el => !el.closest('.media, .embed, .audio, nav.crumbs') &&
    (el.matches('font, span:not([style])') || [...el.style].some(p => !KEEP_INLINE.has(p) && !(p === 'text-align' && (el.parentElement === root || el.matches('td, li'))))));
function cleanInlineStyles(root) {
  let changed = false;
  for (const el of root.querySelectorAll('[style]')) {
    if (el.closest('.media, .embed, .audio, nav.crumbs')) continue;
    const block = el.parentElement === root || el.matches('td, li');
    for (const prop of [...el.style]) {
      if (KEEP_INLINE.has(prop) || (block && prop === 'text-align')) continue;
      el.style.removeProperty(prop);
      changed = true;
    }
    if (!el.getAttribute('style')?.trim()) el.removeAttribute('style');
  }
  for (const f of root.querySelectorAll('font[size], font[face]')) { f.removeAttribute('size'); f.removeAttribute('face'); changed = true; }
  // span que ficou sem estilo nenhum não serve para nada
  for (const s of root.querySelectorAll('span:not([class]):not([style]):not([data-caret])')) { s.replaceWith(...s.childNodes); changed = true; }
  return changed;
}

function onEdited(v = viewOf(editor) || DV, e = null) {
  if (!v.isDoc) { request({ ink: true, media: true }); return; }
  const ed = v.editor;
  normalizeChecklists(ed);
  if (hasStrayStyles(ed)) {
    // desembrulhar spans tiraria o cursor do lugar: marca, limpa e devolve
    const mk = getSelection().isCollapsed ? dropCaretMarker(ed) : null;
    cleanInlineStyles(ed);
    restoreCaret(mk);
  }
  if (!ed.firstElementChild && !ed.textContent.trim()) {
    ed.innerHTML = EMPTY_PAGE;
    const r = document.createRange(); r.setStart(ed.firstChild, 0);
    getSelection().removeAllRanges(); getSelection().addRange(r);
  }
  commitDoc();
}

function dropCaretMarker(root = editor) {
  const sel = getSelection();
  if (!sel.rangeCount || !root.contains(sel.anchorNode)) return null;
  const r = sel.getRangeAt(0).cloneRange();
  r.collapse(false);
  const mk = document.createElement('span');
  mk.dataset.caret = '';
  r.insertNode(mk);
  return mk;
}
function restoreCaret(mk) {
  if (!mk || !mk.isConnected) return;
  const r = document.createRange();
  r.setStartBefore(mk); r.collapse(true);
  mk.remove();
  getSelection().removeAllRanges(); getSelection().addRange(r);
}

/* ------------------------------------------------------------------ *
 *  Fotos e vídeos                                                     *
 * ------------------------------------------------------------------ */
// altura sempre em linhas inteiras da pauta, para o texto seguir alinhado
const figGap = () => V.figGap ?? 0.6;   // em linhas, acima e abaixo da imagem
const linesFor = (w, aspect) => clamp(Math.round(((MM.x1 - MM.x0) * w / 100 / aspect) / MM.step + 2 * figGap()), 2, MM.lines - 2);

function sizeFigures(root) {
  const lh = lhOf(root);
  // player de áudio: duas linhas da pauta no livro (no texto, a altura vem do CSS)
  for (const f of root.querySelectorAll('figure.audio')) f.style.height = 2 * lh + 'px';
  for (const f of root.querySelectorAll('.embed')) {
    f.style.width = (+f.dataset.w || 100) + '%';
    f.style.height = clamp(+f.dataset.lines || 8, 3, MM.lines - 2) * lh + 'px';
  }
  for (const f of root.querySelectorAll('.media')) {
    f.style.width = (+f.dataset.w || 70) + '%';
    const lines = f.dataset.aspect ? linesFor(+f.dataset.w || 70, +f.dataset.aspect) : (+f.dataset.lines || 6);
    f.style.height = lines * lh + 'px';
  }
}

// preenche os breadcrumbs com o caminho atual (acompanha renomear e mover)
function fillCrumbs(nav) {
  const v = viewOf(nav);
  const n = nb();
  if (!n) return;
  const parts = [];
  for (let f = folder(n.folderId); f; f = folder(f.parentId)) parts.unshift({ label: f.name, act: 'folder', id: f.id });
  parts.push({ label: n.name, act: 'notebook', id: n.id });
  const inBook = v && !v.isDoc;
  const sig = parts.map(p => p.label).join('›') + (inBook ? `›${v.page + 1}` : '');
  if (nav.dataset.sig === sig && nav.childElementCount) return;
  nav.dataset.sig = sig;
  nav.contentEditable = 'false';
  nav.setAttribute('aria-label', 'Caminho');
  const kids = [];
  parts.forEach((p, k) => {
    if (k) kids.push(h('span', { class: 'sep-c', 'aria-hidden': 'true' }, '›'));
    kids.push(h('button', { type: 'button', 'data-crumb': p.act, 'data-id': p.id, title: p.act === 'folder' ? 'Mostrar a pasta' : 'Ir para o começo' }, p.label));
  });
  if (inBook) kids.push(h('span', { class: 'sep-c', 'aria-hidden': 'true' }, '›'), h('span', { 'aria-current': 'page' }, `página ${v.page + 1}`));
  nav.replaceChildren(...kids);
}
function refreshCrumbs() {
  let changed = false;
  for (const v of [DV, ...PV]) for (const nav of v.editor.querySelectorAll('nav.crumbs')) {
    const before = nav.dataset.sig;
    fillCrumbs(nav);
    if (nav.dataset.sig !== before) changed = true;
  }
  if (changed) request({ ink: true });
}

function hydrateFigures(root) {
  if (root === docEl || PV.some(v => v.editor === root)) for (const nav of root.querySelectorAll('nav.crumbs')) { delete nav.dataset.sig; fillCrumbs(nav); }
  sizeFigures(root);
  hydrateEmbeds(root);
  hydrateAudio(root);
  for (const f of root.querySelectorAll('.media')) {
    f.contentEditable = 'false';
    if (f.querySelector('.src')) continue;
    const video = f.dataset.kind === 'video';
    const src = document.createElement(video ? 'video' : 'img');
    src.className = 'src';
    if (video) {
      Object.assign(src, { loop: true, playsInline: true, preload: 'auto' });
      src.addEventListener('loadeddata', () => request({ media: true }));
      src.addEventListener('play', () => { f.classList.add('playing'); setPlayIcon(f, true); request({ media: true }); });
      src.addEventListener('pause', () => { f.classList.remove('playing'); setPlayIcon(f, false); request({ media: true }); });
    } else {
      src.alt = '';
      src.addEventListener('load', () => request({ media: true }));
    }
    mediaUrl(f.dataset.media).then(u => {
      if (!u) return;
      if (!video && ANIMATED.test(mediaTypes.get(f.dataset.media) || '')) f.dataset.anim = '1';
      src.src = u;
    });
    const tools = h('div', { class: 'media-tools' },
      h('button', { type: 'button', 'data-act': 'size', title: 'Mudar tamanho', 'aria-label': 'Mudar tamanho' }, svg('size')),
      h('button', { type: 'button', 'data-act': 'del', title: 'Remover', 'aria-label': 'Remover' }, svg('x')));
    const ui = h('div', { class: 'media-ui' },
      video ? h('button', { type: 'button', class: 'play-big', 'data-act': 'play', 'aria-label': 'Reproduzir' }, svg('play')) : '',
      tools);
    f.append(src, ui);
  }
}
function setPlayIcon(f, playing) {
  const b = f.querySelector('.play-big');
  if (!b) return;
  b.replaceChildren(svg(playing ? 'pause' : 'play'));
  b.setAttribute('aria-label', playing ? 'Pausar' : 'Reproduzir');
}

function probeAspect(url, kind) {
  return new Promise(res => {
    const done = (w, hh) => res(w && hh ? w / hh : 4 / 3);
    if (kind === 'video') {
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = () => done(v.videoWidth, v.videoHeight);
      v.onerror = () => done(0, 0);
      v.src = url;
    } else {
      const im = new Image();
      im.onload = () => done(im.naturalWidth, im.naturalHeight);
      im.onerror = () => done(0, 0);
      im.src = url;
    }
  });
}

// bloco (filho direto do editor) que contém o nó
function blockOf(node) {
  while (node && !node.parentNode?.classList?.contains('ed')) node = node.parentNode;
  return node && node.parentNode?.classList?.contains('ed') ? node : null;
}

// guarda o arquivo e devolve a "casca" da foto/vídeo (null se não for imagem nem vídeo)
async function mediaFigure(file) {
  if (file.type.startsWith('audio/')) return audioFigure(file);
  const kind = file.type.startsWith('video/') ? 'video' : file.type.startsWith('image/') ? 'image' : null;
  if (!kind) return null;
  const id = uid();
  memBlobs.set(id, file);
  await Store.putMedia(id, file).catch(console.error);
  const aspect = await probeAspect(await mediaUrl(id), kind);
  const w = aspect < 0.95 ? 40 : 70;
  return h('figure', { class: 'media', 'data-media': id, 'data-kind': kind, 'data-w': w,
                       'data-aspect': aspect.toFixed(4), 'data-lines': linesFor(w, aspect),
                       'data-anim': kind === 'image' && ANIMATED.test(file.type) ? '1' : null });
}
/* ------------------------------------------------------------------ *
 *  Áudio: arquivo guardado no navegador, tocado por um player mínimo *
 * ------------------------------------------------------------------ */
async function audioFigure(file) {
  const id = uid();
  memBlobs.set(id, file);
  await Store.putMedia(id, file).catch(console.error);
  return h('figure', { class: 'audio', 'data-media': id, 'data-name': file.name.replace(/\.[^.]+$/, '') });
}
const fmtTime = s => (Number.isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00');
const AUDIO_ICON = {
  play: '<path d="M5.5 3.5v9l7-4.5z" fill="currentColor" stroke="none"/>',
  pause: '<path d="M5.5 3.5v9M10.5 3.5v9" stroke-width="2"/>',
};
function hydrateAudio(root) {
  for (const f of root.querySelectorAll('figure.audio')) {
    f.contentEditable = 'false';
    if (f.querySelector('audio')) continue;
    const audio = h('audio', { preload: 'metadata' });
    const play = h('button', { type: 'button', class: 'au-play au-ctl', 'aria-label': 'Tocar' });
    const icon = on => { play.innerHTML = `<svg class="i" viewBox="0 0 16 16" aria-hidden="true">${AUDIO_ICON[on ? 'pause' : 'play']}</svg>`; play.setAttribute('aria-label', on ? 'Pausar' : 'Tocar'); };
    icon(false);
    const fill = h('span', { class: 'au-fill' });
    const bar = h('span', { class: 'au-bar au-ctl', role: 'slider', tabindex: '0', 'aria-label': 'Posição do áudio', 'aria-valuemin': '0', 'aria-valuenow': '0' }, fill);
    const time = h('span', { class: 'au-time' }, '0:00');
    const name = h('span', { class: 'au-name' }, f.dataset.name || 'Áudio');
    const show = () => {
      const d = audio.duration, t = audio.currentTime;
      fill.style.width = (d ? (t / d) * 100 : 0) + '%';
      time.textContent = audio.paused && !t ? fmtTime(d) : `${fmtTime(t)} / ${fmtTime(d)}`;
      bar.setAttribute('aria-valuemax', String(Math.round(d || 0)));
      bar.setAttribute('aria-valuenow', String(Math.round(t)));
      bar.setAttribute('aria-valuetext', `${fmtTime(t)} de ${fmtTime(d)}`);
    };
    audio.addEventListener('loadedmetadata', show);
    audio.addEventListener('timeupdate', show);
    audio.addEventListener('play', () => { icon(true); f.classList.add('playing'); });
    audio.addEventListener('pause', () => { icon(false); f.classList.remove('playing'); });
    audio.addEventListener('ended', () => { audio.currentTime = 0; show(); });
    play.addEventListener('click', e => {
      e.stopPropagation();
      if (audio.paused) {
        for (const other of document.querySelectorAll('figure.audio audio')) if (other !== audio) other.pause();
        audio.play().catch(() => toast('Não deu para tocar esse áudio.'));
      } else audio.pause();
    });
    // arrastar ou clicar na barra muda a posição
    const seek = e => {
      const r = bar.getBoundingClientRect();
      if (audio.duration) audio.currentTime = clamp((e.clientX - r.left) / r.width, 0, 1) * audio.duration;
    };
    bar.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); bar.setPointerCapture(e.pointerId); seek(e); });
    bar.addEventListener('pointermove', e => { if (bar.hasPointerCapture(e.pointerId)) seek(e); });
    bar.addEventListener('keydown', e => {
      const d = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
      if (d && audio.duration) { e.preventDefault(); audio.currentTime = clamp(audio.currentTime + d, 0, audio.duration); }
    });
    for (const el of [play, bar]) el.addEventListener('mousedown', e => e.stopPropagation());
    f.append(play, h('span', { class: 'au-main' }, name, bar), time, audio);
    mediaUrl(f.dataset.media).then(u => { if (u) audio.src = u; else name.textContent += ' (arquivo não encontrado neste navegador)'; });
  }
}

async function insertMedia(files, at = null) {
  const sel = getSelection();
  const range = at || (sel.rangeCount && editor.contains(sel.anchorNode) ? sel.getRangeAt(0) : null);
  let block = range ? blockOf(range.startContainer) : null;
  let last = null;
  for (const file of files) {
    const fig = await mediaFigure(file);
    if (!fig) continue;
    if (!block) editor.append(fig);
    else if (isEmptyBlock(block)) block.before(fig);
    else block.after(fig);
    block = fig;
    last = fig;
  }
  if (!last) return;
  if (!last.nextElementSibling || last.nextElementSibling.classList.contains('media')) last.after(h('p', {}, h('br')));
  hydrateFigures(editor);
  editor.focus({ preventScroll: true });
  const r = document.createRange(); r.setStart(last.nextElementSibling, 0); r.collapse(true);
  getSelection().removeAllRanges(); getSelection().addRange(r);
  onEdited();
}

/* ------------------------------------------------------------------ *
 *  Editor e barra de formatação                                       *
 * ------------------------------------------------------------------ */
const toRgb = hex => `rgb(${parseInt(hex.slice(1, 3), 16)}, ${parseInt(hex.slice(3, 5), 16)}, ${parseInt(hex.slice(5, 7), 16)})`;
/* ------------------------------------------------------------------ *
 *  Links                                                              *
 * ------------------------------------------------------------------ */
const LP = { range: null, anchor: null };
// só endereços web, e-mail e telefone (nada de javascript:)
function safeUrl(u) {
  u = String(u || '').trim();
  if (!u) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u) ? 'mailto:' : 'https://') + u;
  return /^(https?:|mailto:|tel:)/i.test(u) ? u : null;
}
function linkAt() {
  const sel = getSelection();
  const n = sel.rangeCount ? sel.anchorNode : null;

  return el?.closest?.('.flow a[href]') || null;
}
const escHtml = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const MEDIA_FILE = /\.(gif|png|jpe?g|webp|apng|mp4|webm|mov|m4v)(\?.*)?$/i;
function openMediaUrlPop(anchorEl = null) {
  openLinkPop(anchorEl);
  if ($('linkPop').hidden) return;
  LP.mode = 'media';
  $('lpTitle').textContent = 'Vídeo ou GIF por link';
  $('lpUrl').value = '';
  $('lpUrl').placeholder = 'YouTube, Vimeo ou endereço de .mp4 / .gif';
  $('lpTextWrap').hidden = true;
  $('lpRemove').hidden = true;
  $('lpSave').textContent = 'Inserir';
}
function videoFigure(url) {
  const m = url.match(VIDEO_HOST);
  if (!m) return null;
  const src = m[1] ? `https://www.youtube-nocookie.com/embed/${m[1]}` : `https://player.vimeo.com/video/${m[2]}`;
  return h('figure', { class: 'embed', 'data-kind': 'video', 'data-id': uid(), 'data-w': 100, 'data-lines': 12,
                       'data-src': JSON.stringify({ src, url }) });
}
async function insertMediaUrl(url, block = null) {
  const fig = videoFigure(url);
  if (fig) {
    insertBlockEl(fig, block);
    hydrateFigures(editor);
    onEdited();
    return;
  }
  try {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error(res.status);
    const blob = await res.blob();
    if (!/^(image|video)\//.test(blob.type)) throw new Error('tipo');
    const name = decodeURIComponent(url.split('?')[0].split('/').pop() || 'arquivo');
    await insertMedia([new File([blob], name, { type: blob.type })]);
  } catch {
    toast('Esse endereço não deixa usar o arquivo. Baixe-o e arraste para a folha.');
  }
}

function openLinkPop(anchorEl = null) {

  $('lpErr').hidden = true;

  const r = (anchorEl || LP.anchor)?.getBoundingClientRect() || LP.range.getClientRects()[0] || editor.getBoundingClientRect();
  const w = pop.offsetWidth, hh = pop.offsetHeight;
  pop.style.left = clamp(r.left, 8, innerWidth - w - 8) + 'px';

function closeLinkPop(refocus = true) {
  $('linkPop').hidden = true;

    if (LP.range) { getSelection().removeAllRanges(); getSelection().addRange(LP.range); }
