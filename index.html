}
function applyLink() {
  const url = safeUrl($('lpUrl').value);
  if (!url) { $('lpUrl').setAttribute('aria-invalid', 'true'); $('lpErr').hidden = false; $('lpUrl').focus(); return; }
  closeLinkPop();
  if (LP.mode === 'media') { insertMediaUrl(url, LP.range ? blockOf(LP.range.startContainer) : null); return; }
  if (LP.anchor?.isConnected) LP.anchor.setAttribute('href', url);
  else if (LP.range.collapsed) {
    const text = $('lpText').value.trim() || url.replace(/^(https?:\/\/|mailto:|tel:)/i, '');
    document.execCommand('insertHTML', false, `<a href="${escHtml(url)}">${escHtml(text)}</a>&nbsp;`);
  } else document.execCommand('createLink', false, url);
  syncToolbar();
  onEdited();
}
function removeLink() {
  closeLinkPop();
  if (LP.anchor?.isConnected) {
    const r = document.createRange();
    r.selectNodeContents(LP.anchor);
    getSelection().removeAllRanges(); getSelection().addRange(r);
  }
  document.execCommand('unlink');
  syncToolbar();
  onEdited();
}
function setupLinks() {
  $('lpSave').addEventListener('click', applyLink);
  $('lpCancel').addEventListener('click', () => closeLinkPop());
  $('lpRemove').addEventListener('click', removeLink);
  $('linkPop').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); applyLink(); }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeLinkPop(); }
  });
  addEventListener('pointerdown', e => {
    if (!$('linkPop').hidden && !$('linkPop').contains(e.target) && !e.target.closest('[data-cmd="link"]')) closeLinkPop(false);
  });
  // lendo: o link abre numa aba nova; editando: Ctrl/⌘ + clique (o clique simples posiciona o cursor)
  document.addEventListener('click', e => {
    const a = e.target.closest?.('.flow a[href]');
    if (!a) return;
    e.preventDefault();
    if (a.closest('.ed')?.isContentEditable && !(e.ctrlKey || e.metaKey)) return;
    if (a.dataset.wiki != null) { openWiki(a.dataset.wiki); return; }
    const url = safeUrl(a.getAttribute('href'));
    if (url) window.open(url, '_blank', 'noopener,noreferrer');
  });
  document.addEventListener('mouseover', e => {
    const a = e.target.closest?.('.flow a[href]');
    if (!a) return;
    const where = a.dataset.wiki != null ? `Caderno “${a.dataset.wiki}”` : a.getAttribute('href');
    a.title = a.closest('.ed')?.isContentEditable ? `${where}  (Ctrl + clique para abrir)` : where;
  });
}
// [[Outro caderno]]: abre o caderno com esse nome
function openWiki(name) {
  const f = fold(name.trim().replace(/^\d+\s*-\s*/, ''));
  // nomes repetidos em pastas diferentes: prefere o da mesma pasta do caderno aberto
  const here = nb()?.folderId ?? null;
  const exact = lib.notebooks.filter(x => fold(x.name) === f);
  const n = exact.find(x => (x.folderId ?? null) === here) || exact[0] || lib.notebooks.find(x => fold(x.name).startsWith(f));
  if (!n) { toast(`Não há caderno chamado “${name}”.`); return; }
  closeBook();
  openNotebook(n.id);
}

/* ------------------------------------------------------------------ *
 *  Checklist                                                          *
 * ------------------------------------------------------------------ */
function checklistAt() {
  const sel = getSelection();
  const n = sel.rangeCount ? sel.anchorNode : null;
  const el = n?.nodeType === 3 ? n.parentElement : n;
  return el?.closest?.('.flow ul.checklist') || null;
}
function makeChecklist() {
  const cur = checklistAt();
  if (cur) { cur.classList.remove('checklist'); cur.querySelectorAll('li').forEach(li => li.removeAttribute('data-checked')); return; }
  const inList = (() => { const sel = getSelection(); const n = sel.anchorNode; const el = n?.nodeType === 3 ? n.parentElement : n; return el?.closest?.('.flow ul'); })();
  if (!inList) { document.execCommand('insertUnorderedList'); unwrapLists(); }
  const ul = (() => { const sel = getSelection(); const n = sel.anchorNode; const el = n?.nodeType === 3 ? n.parentElement : n; return el?.closest?.('.flow ul'); })();
  if (!ul) return;
  ul.classList.add('checklist');
  for (const li of ul.children) if (!li.dataset.checked) li.dataset.checked = 'false';
}
// itens novos (Enter) nascem desmarcados
function normalizeChecklists(root) {
  for (const li of root.querySelectorAll('ul.checklist > li')) {
    if (!li.dataset.checked || (li.dataset.checked === 'true' && !li.textContent.trim())) li.dataset.checked = 'false';
  }
}
function toggleCheck(li) {
  const v = viewOf(li);
  li.dataset.checked = li.dataset.checked === 'true' ? 'false' : 'true';
  if (!v) return;
  if (v.isDoc) { li.removeAttribute('aria-checked'); onEdited(v); return; }
  // no livro: a mesma caixinha é marcada no texto (pela posição entre todas as caixinhas)
  const n = nb();
  const count = html => { const d = document.createElement('div'); d.innerHTML = html; return d.querySelectorAll('ul.checklist > li'); };
  let idx = [...v.editor.querySelectorAll('ul.checklist > li')].indexOf(li);
  for (let p = 0; p < v.page; p++) idx += count(n.pages[p]).length;
  const d = document.createElement('div');
  d.innerHTML = n.html;
  const target = d.querySelectorAll('ul.checklist > li')[idx];
  if (target) {
    target.dataset.checked = li.dataset.checked;
    n.html = d.innerHTML;
    n.updated = Date.now();
    if (n.source) n.source.dirty = true;
  }
  n.pages[v.page] = serialize(v.editor);
  saveSoon();
  request({ ink: true });
}

/* ------------------------------------------------------------------ *
 *  Tipo do bloco (texto, título, subtítulo, nota, citação)           *
 * ------------------------------------------------------------------ */
const TEXT_BLOCKS = /^(P|H1|H2|H3|H4|ASIDE|BLOCKQUOTE)$/;
// lido do próprio documento: o queryCommandValue('formatBlock') do navegador nem sempre acerta
function currentBlockTag() {
  const sel = getSelection();
  const b = sel.rangeCount ? blockOf(sel.anchorNode) : null;
  return b ? b.tagName.toLowerCase() : '';
}
function setBlock(tag) {
  const sel = getSelection();
  const before = sel.rangeCount ? blockOf(sel.anchorNode) : null;
  document.execCommand('formatBlock', false, tag);
  const after = getSelection().rangeCount ? blockOf(getSelection().anchorNode) : null;
  if (after?.tagName.toLowerCase() === tag) return;
  // o navegador não converteu: troca o elemento à mão, mantendo alinhamento e cursor
  const b = after?.isConnected ? after : before;
  if (!b?.isConnected || !TEXT_BLOCKS.test(b.tagName)) return;
  const mk = dropCaretMarker();
  const n = document.createElement(tag);
  if (b.getAttribute('style')) n.setAttribute('style', b.getAttribute('style'));
  n.append(...b.childNodes);
  b.replaceWith(n);
  restoreCaret(mk);
}

/* ------------------------------------------------------------------ *
 *  Componente selecionado: popover com mover, duplicar e excluir      *
 * ------------------------------------------------------------------ */
const SELECTABLE = 'nav.crumbs, hr, figure.media, figure.embed, figure.audio';
const SELB = { el: null };
function blockName(el) {
  if (el.matches('nav.crumbs')) return 'Breadcrumb';
  if (el.matches('hr')) return 'Divisor';
  if (el.matches('figure.embed')) return { demo: 'Exemplo interativo', code: 'Bloco de código', video: 'Vídeo' }[el.dataset.kind] || 'Componente';
  if (el.matches('figure.audio')) return 'Áudio';
  if (el.dataset.kind === 'video') return 'Vídeo';
  return el.dataset.anim === '1' ? 'GIF' : 'Foto';
}
function placeBlockPop() {
  const el = SELB.el, pop = $('blockPop');
  if (!el?.isConnected) { clearBlockSel(); return; }
  const r = el.getBoundingClientRect();
  const w = pop.offsetWidth, hh = pop.offsetHeight;
  let top = r.top - hh - 12;
  if (top < 64) top = r.bottom + 12;
  pop.style.top = clamp(top, 8, innerHeight - hh - 8) + 'px';
  pop.style.left = clamp(r.left + r.width / 2 - w / 2, 8, innerWidth - w - 8) + 'px';
  const sibs = [el.previousElementSibling, el.nextElementSibling];
  pop.querySelector('[data-bp="up"]').disabled = !sibs[0];
  pop.querySelector('[data-bp="down"]').disabled = !sibs[1];
}
function selectBlock(el) {
  if (SELB.el && SELB.el !== el) SELB.el.classList.remove('is-selected');
  SELB.el = el;
  el.classList.add('is-selected');
  activate(viewOf(el));
  getSelection().removeAllRanges();
  $('bpName').textContent = blockName(el);
  $('blockPop').hidden = false;
  placeBlockPop();
}
function clearBlockSel() {
  SELB.el?.classList.remove('is-selected');
  SELB.el = null;
  $('blockPop').hidden = true;
}
function blockAction(act) {
  const el = SELB.el;
  if (!el?.isConnected) return;
  const v = viewOf(el);
  if (act === 'del') {
    clearBlockSel();
    withUndo(`${blockName(el)} removido`, () => { el.remove(); onEdited(v); request({ ink: true, media: true }); });
    return;
  }
  if (act === 'up' && el.previousElementSibling) el.previousElementSibling.before(el);
  if (act === 'down' && el.nextElementSibling) el.nextElementSibling.after(el);
  if (act === 'dup') {
    const c = el.cloneNode(true);
    c.classList.remove('is-selected');
    if (c.matches('figure.media, figure.embed, figure.audio')) { c.replaceChildren(); c.removeAttribute('style'); }
    if (c.matches('figure.embed')) c.dataset.id = uid();
    if (c.matches('nav.crumbs')) { c.replaceChildren(); delete c.dataset.sig; }
    el.after(c);
    hydrateFigures(v.editor);
    selectBlock(c);
  }
  onEdited(v);
  request({ ink: true, media: true });
  requestAnimationFrame(placeBlockPop);
}
function setupBlockSel() {
  $('blockPop').addEventListener('mousedown', e => e.preventDefault());
  $('blockPop').addEventListener('click', e => { const b = e.target.closest('[data-bp]'); if (b && !b.disabled) blockAction(b.dataset.bp); });
  addEventListener('pointerdown', e => {
    if (SELB.el && !SELB.el.contains(e.target) && !$('blockPop').contains(e.target)) clearBlockSel();
  }, true);
  addEventListener('keydown', e => {
    if (!SELB.el) return;
    if (e.key === 'Escape') { e.preventDefault(); clearBlockSel(); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); blockAction('del'); }
    else if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); blockAction(e.key === 'ArrowUp' ? 'up' : 'down'); }
    else if (e.key === 'Enter') {               // Enter: linha de texto logo abaixo do componente
      e.preventDefault();
      const el = SELB.el, v = viewOf(el);
      clearBlockSel();
      const p = h('p', {}, h('br'));
      el.after(p);
      v.editor.focus({ preventScroll: true });
      const r = document.createRange(); r.setStart(p, 0); r.collapse(true);
      getSelection().removeAllRanges(); getSelection().addRange(r);
      onEdited(v);
    }
  }, true);
  addEventListener('scroll', () => { if (SELB.el) placeBlockPop(); }, { passive: true });
  addEventListener('resize', () => { if (SELB.el) requestAnimationFrame(placeBlockPop); });
}

const HL_COLOR = '#fde047';
function isHilited() {
  const sel = getSelection();
  if (!sel.rangeCount) return false;
  const a = sel.anchorNode;
  for (let e = a?.nodeType === 3 ? a.parentElement : a; e && !e.classList?.contains('ed'); e = e.parentElement) {
    const bg = e.style?.backgroundColor;
    if (bg) return bg !== 'transparent' && !/,\s*0\)$/.test(bg);
  }
  return false;
}
function toggleHilite() {
  if (!nb()?.editing) return;
  if (!editor.contains(getSelection().anchorNode)) editor.focus();
  const on = isHilited();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('hiliteColor', false, on ? 'transparent' : HL_COLOR);
  document.execCommand('styleWithCSS', false, false);
  syncToolbar();
  onEdited();
}
function syncToolbar() {
  const sel = getSelection();
  if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return;
  const block = currentBlockTag();
  const color = String(document.queryCommandValue('foreColor')).replace(/\s+/g, ' ');
  for (const b of toolbar.querySelectorAll('[data-cmd]')) {
    const { cmd, val } = b.dataset;
    let on = null;
    if (cmd === 'heading') on = block === 'h1';
    else if (cmd === 'paragraph') on = block === 'p';
    else if (cmd === 'h2' || cmd === 'h3' || cmd === 'h4') on = block === cmd;
    else if (cmd === 'note') on = block === 'aside';
    else if (cmd === 'hilite') on = isHilited();
    else if (cmd === 'link') on = !!linkAt();
    else if (cmd === 'checklist') on = !!checklistAt();
    else if (cmd === 'foreColor') on = color === toRgb(val);
    else if (b.hasAttribute('data-toggle')) on = document.queryCommandState(cmd);
    if (on !== null) b.setAttribute('aria-pressed', String(on));
  }
}

// o Chrome às vezes cria <p><ul>…</ul></p>; a lista vira bloco próprio
function unwrapLists() {
  const bad = [...editor.children].filter(p => p.tagName === 'P' && p.children.length === 1 &&
    /^(UL|OL)$/.test(p.firstElementChild.tagName) && p.textContent === p.firstElementChild.textContent);
  if (!bad.length) return;
  const mk = dropCaretMarker();
  for (const p of bad) p.replaceWith(p.firstElementChild);
  restoreCaret(mk);
}

/* Colar texto formatado: o HTML da área de transferência é limpo e vira blocos do caderno.
   Fica só o que o caderno entende (títulos, parágrafos, listas, checklists, citações, tabelas,
   divisores, negrito, itálico, riscado, código e links); estilos, classes e scripts vão embora. */
function cleanPastedHtml(html) {
  const src = new DOMParser().parseFromString(html, 'text/html').body;
  const BLOCK = { H1: 'h1', H2: 'h2', H3: 'h3', H4: 'h4', H5: 'h4', H6: 'h4', P: 'p', BLOCKQUOTE: 'blockquote', UL: 'ul', OL: 'ol', LI: 'li', HR: 'hr',
                  TABLE: 'table', THEAD: 'tbody', TBODY: 'tbody', TFOOT: 'tbody', TR: 'tr', TD: 'td', TH: 'td', PRE: 'p' };
  const INLINE = { B: 'b', STRONG: 'b', I: 'i', EM: 'i', S: 'strike', STRIKE: 'strike', DEL: 'strike', U: 'u', CODE: 'code', BR: 'br' };
  const walk = (node, inPre) => {
    const out = [];
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { out.push(document.createTextNode(inPre ? n.data : n.data.replace(/\s+/g, ' '))); continue; }
      if (n.nodeType !== 1 || /^(SCRIPT|STYLE|META|LINK|TITLE|NOSCRIPT|TEMPLATE|SVG|BUTTON|INPUT|SELECT|TEXTAREA)$/.test(n.tagName)) {
        if (n.tagName === 'INPUT' && n.type === 'checkbox') { const li = n.closest('li'); if (li) li.dataset.wasCheck = n.checked ? 'true' : 'false'; }
        continue;
      }
      const tag = n.tagName;
      if (tag === 'A') {
        const url = safeUrl(n.getAttribute('href'));
        const kids = walk(n, inPre);
        if (url && !/^#/.test(n.getAttribute('href') || '')) { const a = h('a', { href: url }); a.append(...kids); out.push(a); } else out.push(...kids);
        continue;
      }
      const t = BLOCK[tag] || INLINE[tag];
      const kids = walk(n, inPre || tag === 'PRE');
      if (!t) { out.push(...kids); continue; }           // div, span, section…: só o conteúdo
      const el = document.createElement(t);
      if (t === 'li' && n.dataset.wasCheck) el.dataset.checked = n.dataset.wasCheck;
      if (tag === 'PRE' && !(kids.length === 1 && kids[0].tagName === 'CODE')) el.append(h('code', {}, ...kids)); else el.append(...kids);
      if (t === 'table') { el.className = 'tbl'; el.dataset.head = n.querySelector('th') ? '1' : '0'; }
      out.push(el);
    }
    return out;
  };
  const box = document.createElement('div');
  box.append(...walk(src, false));
  // citação, item, célula e título guardam só texto: parágrafos de dentro viram quebras de linha
  for (const p of box.querySelectorAll('blockquote p, li p, td p, h1 p, h2 p, h3 p, h4 p')) {
    if (p.previousSibling) p.before(document.createElement('br'));
    p.replaceWith(...p.childNodes);
  }
  // tabela: um corpo só
  for (const t of box.querySelectorAll('table')) {
    const bodies = t.querySelectorAll('tbody');
    for (const b of [...bodies].slice(1)) { bodies[0].append(...b.childNodes); b.remove(); }
  }
  // listas com caixinha viram checklist
  for (const ul of box.querySelectorAll('ul')) if ([...ul.children].some(li => li.dataset.checked)) {
    ul.className = 'checklist';
    for (const li of ul.children) li.dataset.checked ||= 'false';
  }
  // texto solto entre blocos vira parágrafo
  for (const n of [...box.childNodes]) {
    if (n.nodeType === 3 && !n.data.trim()) { n.remove(); continue; }
    if (n.nodeType === 3 || (n.nodeType === 1 && INLINE[n.tagName.toUpperCase()]) || n.tagName === 'A') {
      const p = h('p'); n.before(p); p.append(n);
      while (p.nextSibling && (p.nextSibling.nodeType === 3 || INLINE[p.nextSibling.tagName?.toUpperCase()] || p.nextSibling.tagName === 'A')) p.append(p.nextSibling);
    }
  }
  for (const p of box.querySelectorAll('p, li, h1, h2, h3, h4, blockquote, td')) {
    if (p.firstChild?.nodeType === 3) p.firstChild.data = p.firstChild.data.replace(/^\s+/, '');
    if (p.lastChild?.nodeType === 3) p.lastChild.data = p.lastChild.data.replace(/\s+$/, '');
  }
  for (const p of box.querySelectorAll('p, h1, h2, h3, h4')) if (!p.textContent.trim() && !p.querySelector('br')) p.remove();
  return box;
}
function richPaste(html) {
  if (!html || cellAt()) return false;
  const box = cleanPastedHtml(html);
  // só vale a pena se trouxer formatação; texto simples segue o caminho normal
  if (!box.querySelector('a, b, i, strike, u, code, h1, h2, h3, h4, ul, ol, blockquote, table, hr') && box.querySelectorAll('p').length < 2) return false;
  const onlyInline = box.children.length === 1 && box.firstElementChild.tagName === 'P';
  if (onlyInline) document.execCommand('insertHTML', false, box.firstElementChild.innerHTML);
  else insertBlocks(box);
  cleanInlineStyles(docEl);
  onEdited(DV);
  return true;
}
/* Insere blocos prontos onde está o cursor, cada um com o próprio tipo.
   (o insertHTML do navegador faz o conteúdo herdar o formato da linha atual,
   e um título no cursor transformava tudo em título) */
function insertBlocks(box) {
  const sel = getSelection();
  if (sel.rangeCount && !sel.isCollapsed) sel.deleteFromDocument();
  const blocks = [...box.childNodes].filter(n => n.nodeType === 1);
  if (!blocks.length) return;
  const range = sel.rangeCount ? sel.getRangeAt(0) : null;
  let cur = range && docEl.contains(range.startContainer) ? blockOf(range.startContainer) : null;
  if (!cur) docEl.append(...blocks);
  else if (isEmptyBlock(cur) || !cur.textContent.trim() && !cur.querySelector('.media, .embed, .audio')) cur.replaceWith(...blocks);
  else if (TEXT_BLOCKS.test(cur.tagName)) {
    // cursor no meio de um texto: divide a linha e encaixa os blocos entre as metades
    const tail = document.createRange();
    tail.setStart(range.startContainer, range.startOffset);
    tail.setEnd(cur, cur.childNodes.length);
    const rest = cur.cloneNode(false);
    rest.append(tail.extractContents());
    cur.after(...blocks, ...(rest.textContent.trim() ? [rest] : []));
    if (!cur.textContent.trim()) cur.remove();
  } else cur.after(...blocks);
  hydrateFigures(docEl);
  const last = blocks[blocks.length - 1];
  const r = document.createRange();
  r.selectNodeContents(last);
  r.collapse(false);
  sel.removeAllRanges(); sel.addRange(r);
}

/* Colar Markdown: texto de várias linhas com títulos, listas, citações ou negrito vira blocos do caderno. */
// só texto de várias linhas (uma linha solta continua sendo colada como texto, no meio do parágrafo)
const looksLikeMarkdown = t => /\n/.test(t.trim()) &&
  (/^(#{1,6}\s|[-*+]\s|\d+[.)]\s|>\s|\|.*\|\s*$|```)/m.test(t) || /\*\*[^*\n]+\*\*|\[[^\]\n]+\]\([^)\n]+\)/.test(t));
async function pasteMarkdown(txt) {
  const html = await mdToHtml(txt, { dir: '', files: new Map() });
  docEl.focus({ preventScroll: true });
  const box = document.createElement('div');
  box.innerHTML = html;
  insertBlocks(box);
  cleanInlineStyles(docEl);
  hydrateFigures(docEl);
  onEdited(DV);
}

/* Atalhos de Markdown no começo de um parágrafo, ao digitar o espaço:
   "# " a "#### " viram títulos; "- " ou "* " lista; "1. " lista numerada; "> " citação; "[ ] " checklist. */
// [padrão, ação, vale também em título/nota/citação (não só em parágrafo)?]
const MD_SHORTCUTS = [
  [/^(#{1,4})[  ]/, m => setBlock(`h${m[1].length}`), true],
  [/^[-*][  ]/, () => { document.execCommand('insertUnorderedList'); unwrapLists(); }, false],
  [/^1[.)][  ]/, () => { document.execCommand('insertOrderedList'); unwrapLists(); }, false],
  [/^>[  ]/, () => setBlock('blockquote'), true],
  [/^\[ ?\][  ]/, () => makeChecklist(), false],
];
function mdShortcut(e) {
  if (e.inputType !== 'insertText' || !/[  ]/.test(e.data || '') || !nb()?.editing) return;
  const sel = getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return;
  const block = blockOf(sel.anchorNode);
  if (!block || !TEXT_BLOCKS.test(block.tagName) || cellAt()) return;
  const before = document.createRange();
  before.setStart(block, 0);
  before.setEnd(sel.anchorNode, sel.anchorOffset);
  const typed = before.toString();
  const first = block.firstChild;
  for (const [re, run, anyBlock] of MD_SHORTCUTS) {
    if (!anyBlock && block.tagName !== 'P') continue;
    const m = typed.match(re);
    // o espaço do atalho precisa ter sido digitado agora (não vale texto antigo que já começava assim)
    if (!m || typed.length - e.data.length > m[0].length - 1) continue;
    if (first?.nodeType !== 3 || first.length < m[0].length) return;
    const prefix = document.createRange();
    prefix.setStart(first, 0);
    prefix.setEnd(first, m[0].length);
    const mk = dropCaretMarker(block);
    sel.removeAllRanges(); sel.addRange(prefix);
    document.execCommand('delete');             // apaga o "# " (fica no desfazer)
    restoreCaret(mk);
    if (!block.textContent && !block.querySelector('br')) block.append(document.createElement('br'));
    run(m);
    syncToolbar();
    return;
  }
}

function setupEditor() {
  document.execCommand('defaultParagraphSeparator', false, 'p');
  document.execCommand('styleWithCSS', false, false);

  // livro: só leitura, mas as caixinhas, os vídeos e o caminho respondem ao clique
  for (const v of PV) {
    const ed = v.editor;
    const boxOf = e => {
      const li = e.target.closest?.('ul.checklist > li');
      return li && e.clientX < li.getBoundingClientRect().left ? li : null;
    };
    ed.addEventListener('mousedown', e => { if (e.target.closest('[data-act], [data-crumb]') || boxOf(e)) e.preventDefault(); });
    ed.addEventListener('click', e => {
      const li = boxOf(e);
      if (li) { activate(v); toggleCheck(li); return; }
      const b = e.target.closest('[data-act="play"]');
      if (b) { const vd = b.closest('.media')?.querySelector('video'); if (vd) vd.paused ? vd.play() : vd.pause(); return; }
      const c = e.target.closest('[data-crumb]');
      if (!c) return;
      closeBook();
      if (c.dataset.crumb === 'folder') openFolder(c.dataset.id); else openNotebook(c.dataset.id);
    });
  }
  for (const v of [DV]) {
    const ed = v.editor;
    ed.addEventListener('input', e => { mdShortcut(e); onEdited(v, e); });
    ed.addEventListener('keydown', e => tableKeys(e));
    ed.addEventListener('paste', e => {
    e.preventDefault();
    const files = [...e.clipboardData.files].filter(f => /^(image|video|audio)\//.test(f.type));
    if (files.length) insertMedia(files);
    else {
      const txt = e.clipboardData.getData('text/plain');
      const url = /^\S+$/.test(txt.trim()) && /^(https?:\/\/|www\.)/i.test(txt.trim()) ? safeUrl(txt) : null;
      const here = blockOf(getSelection().anchorNode);
      if (url && getSelection().isCollapsed && isEmptyBlock(here) && (VIDEO_HOST.test(url) || MEDIA_FILE.test(url))) insertMediaUrl(url, here);
      else if (url && !getSelection().isCollapsed) document.execCommand('createLink', false, url);   // colou um endereço sobre um trecho
      else if (looksLikeMarkdown(txt) && !cellAt()) pasteMarkdown(txt);   // colou Markdown: entra formatado
      else if (richPaste(e.clipboardData.getData('text/html'))) {}        // colou texto formatado (Claude, sites, Docs): mantém títulos, listas e links
      else document.execCommand('insertText', false, txt);  // só texto: a folha decide a letra
    }
    });
    ed.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
    ed.addEventListener('drop', e => {
      if (![...e.dataTransfer.types].includes('Files')) return;
      e.preventDefault();
      const files = [...e.dataTransfer.files].filter(f => /^(image|video|audio)\//.test(f.type));
      if (!files.length || !nb().editing) return;
      activate(v);
      const at = document.caretRangeFromPoint?.(e.clientX, e.clientY) ?? null;
      insertMedia(files, at && ed.contains(at.startContainer) ? at : null);
    });
    ed.addEventListener('mousedown', e => { if (e.target.closest('[data-act]')) e.preventDefault(); });
    ed.addEventListener('click', e => mediaAction(e));
    const boxOf = e => {
      const li = e.target.closest?.('ul.checklist > li');
      return li && e.clientX < li.getBoundingClientRect().left ? li : null;
    };
    ed.addEventListener('mousedown', e => { if (e.target.closest('[data-crumb]') || boxOf(e)) e.preventDefault(); });
    ed.addEventListener('click', e => { const li = boxOf(e); if (li) toggleCheck(li); });
    // componentes (breadcrumb, divisor, fotos, exemplos) são selecionados como bloco
    ed.addEventListener('mousedown', e => {
      if (!nb()?.editing || e.target.closest('[data-act], .media-ui, .au-ctl')) return;
      const blk = e.target.closest(SELECTABLE);
      if (blk && ed.contains(blk)) { e.preventDefault(); selectBlock(blk); }
    });
    ed.addEventListener('click', e => {
      const c = e.target.closest('[data-crumb]');
      if (!c) return;
      if (nb()?.editing && !(e.ctrlKey || e.metaKey)) return;    // editando, o clique seleciona o bloco (Ctrl+clique navega)
      if (c.dataset.crumb === 'folder') openFolder(c.dataset.id);
      else { openNotebook(c.dataset.id); scrollTo(0, 0); }
    });
  }
  document.addEventListener('selectionchange', syncToolbar);

  // botões das fotos/vídeos e dos exemplos
  function mediaAction(e) {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const f = b.closest('.media, .embed, .audio');
    const v = viewOf(f);
    activate(v);
    const act = b.dataset.act;
    if (act === 'edit') { openCodeModal({ fig: f }); return; }
    if (act === 'code') { f.dataset.code = f.dataset.code === '1' ? '0' : '1'; buildEmbed(f); commitView(v); return; }
    if (act === 'size' && f.classList.contains('embed')) {
      f.dataset.w = EMBED_WIDTHS[(EMBED_WIDTHS.indexOf(+f.dataset.w) + 1) % EMBED_WIDTHS.length];
      sizeFigures(v.editor);
      onEdited(v);
      return;
    }
    if (act === 'play') {
      const v = f.querySelector('video');
      v.paused ? v.play() : v.pause();
      return;
    }
    if (act === 'del') { f.querySelector('video')?.pause(); f.remove(); }
    if (act === 'size') {
      const w = MEDIA_WIDTHS[(MEDIA_WIDTHS.indexOf(+f.dataset.w) + 1) % MEDIA_WIDTHS.length];
      f.dataset.w = w;
      f.dataset.lines = linesFor(w, +f.dataset.aspect || 4 / 3);
      sizeFigures(v.editor);
    }
    onEdited(v);
  }

  toolbar.addEventListener('mousedown', e => { if (e.target.closest('[data-cmd]')) e.preventDefault(); });
  toolbar.addEventListener('click', e => {
    const b = e.target.closest('[data-cmd]');
    if (!b) return;
    const { cmd, val } = b.dataset;
    if (cmd === 'media') { $('file').click(); return; }
    if (cmd === 'hilite') { toggleHilite(); return; }
    if (cmd === 'link') { openLinkPop(b); return; }
    if (cmd === 'checklist') { if (!editor.contains(getSelection().anchorNode)) editor.focus(); if (cellAt()) return; makeChecklist(); syncToolbar(); onEdited(); return; }
    if (cmd === 'insert') { if (!editor.contains(getSelection().anchorNode)) editor.focus(); openSlash(null, b); return; }
    if (!editor.contains(getSelection().anchorNode)) editor.focus();
    const blockTag = { paragraph: 'p', heading: 'h1', h2: 'h2', h3: 'h3', h4: 'h4', note: 'aside' }[cmd];
    // célula de tabela: só negrito, itálico, riscado, link e cor
    if (cellAt() && (blockTag || /List|justify/.test(cmd))) { toast('Dentro da tabela, só negrito, itálico, riscado e link.'); return; }
    if (blockTag) {
      setBlock(currentBlockTag() === blockTag ? 'p' : blockTag);   // clicar de novo volta a ser texto
    } else {
      document.execCommand(cmd, false, val ?? null);
    }
    if (cmd === 'insertUnorderedList' || cmd === 'insertOrderedList') unwrapLists();
    syncToolbar();
    onEdited();
  });
  $('fileAudio').addEventListener('change', e => {
    const files = [...e.target.files];
    e.target.value = '';
    if (files.length) insertMedia(files);
  });
  $('file').addEventListener('change', e => {
    const files = [...e.target.files];
    e.target.value = '';
    if (files.length) insertMedia(files);
  });

}

 *  Paginação                                                          *
 * ------------------------------------------------------------------ */
function applyMode() {
  const ed = !!nb()?.editing;
  document.body.classList.toggle('viewing', !ed);
  docEl.contentEditable = ed ? 'true' : 'false';
  docEl.setAttribute('role', ed ? 'textbox' : 'article');
  if (ed) docEl.setAttribute('aria-multiline', 'true'); else docEl.removeAttribute('aria-multiline');
  docEl.setAttribute('aria-label', ed ? 'Texto do caderno, editando' : 'Texto do caderno');
  for (const v of PV) v.editor.setAttribute('aria-label', `Página ${v.page + 1} do livro`);
  for (const b of document.querySelectorAll('.mode-seg button')) b.setAttribute('aria-pressed', String((b.dataset.mode === 'edit') === ed));
  if (!ed && typeof closeSlash === 'function') closeSlash();
  if (!ed && typeof clearBlockSel === 'function') clearBlockSel();
  if (!ed && typeof hideTblPop === 'function') hideTblPop();
}
function updatePager() {
  const n = nb();
  if (!n) return;
  applyMode();
  if (!FV.id) document.title = `${n.name} · Delarry Estudos`;
  refreshCrumbs();
  if (!BOOK.open || !n.pages) return;
  $('bookLabel').textContent = `${n.name} · `;
  const start = spreadStart(curPage), total = n.pages.length;
  $('pageLabel').textContent = S?.pages === 2 && start + 1 < total
    ? `páginas ${start + 1}–${start + 2} de ${total}` : `página ${S?.pages === 2 ? start + 1 : curPage + 1} de ${total}`;
  $('pgPrev').disabled = $('flipPrev').disabled = start === 0;
  $('pgNext').disabled = $('flipNext').disabled = start + (S?.pages || 1) >= total;
}

function setupPager() {
  document.querySelector('.mode-seg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    nb().editing = b.dataset.mode === 'edit';
    applyMode();
    saveSoon();
    if (nb().editing) docEl.focus({ preventScroll: true });
  });
  $('bookBtn').addEventListener('click', openBook);
  $('bookClose').addEventListener('click', closeBook);
  // terminada a animação de abrir, a folha é redesenhada no tamanho final
  $('reader').addEventListener('animationend', () => request({ layout: true }));
  $('ttsPlay').addEventListener('click', () => (TTS.on ? ttsPause() : ttsStart()));
  $('ttsDoc').addEventListener('click', () => (TTS.on ? ttsPause() : ttsStart()));
  let sw = null;
  book.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    sw = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  book.addEventListener('pointerup', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y, dt = performance.now() - sw.t;
    sw = null;
    if (Math.abs(dx) > 48 && Math.abs(dy) < Math.abs(dx) * 0.6 && dt < 700) (dx < 0 ? next : prev)();
  });
  book.addEventListener('pointercancel', () => { sw = null; });
  $('ttsStop').addEventListener('click', ttsStop);
  const step = () => S?.pages || 1;
  var prev = () => goPage(spreadStart(curPage) - step()), next = () => goPage(spreadStart(curPage) + step());
  $('pgPrev').addEventListener('click', prev);
  $('pgNext').addEventListener('click', next);
  $('flipPrev').addEventListener('click', prev);
  $('flipNext').addEventListener('click', next);
  addEventListener('keydown', e => {
    if (e.defaultPrevented || !BOOK.open) return;
    if (e.key === 'Escape') {
      if (!$('viewPanel').hidden) return;            // o Esc fecha antes o painel
      e.preventDefault(); closeBook(); return;
    }
    const typing = e.target.closest?.('input, textarea, select, [contenteditable="true"], [role="slider"]');
    const free = !typing && !e.ctrlKey && !e.metaKey && !e.altKey;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (e.key === 'PageDown' || (free && (k === 'ArrowRight' || k === 's'))) { e.preventDefault(); next(); }
    if (e.key === 'PageUp' || (free && (k === 'ArrowLeft' || k === 'a'))) { e.preventDefault(); prev(); }
    if (free && e.key === 'Home') { e.preventDefault(); goPage(0); }
    if (free && e.key === 'End') { e.preventDefault(); goPage(nb().pages.length - 1); }
  });
}

 *  Biblioteca: pastas e cadernos                                      *
 * ------------------------------------------------------------------ */
const byName = (a, b) => a.name.localeCompare(b.name, 'pt-BR', { numeric: true });
// ordem escolhida pelo usuário; o que ainda não foi ordenado vai para o fim, por nome
const bySort = (a, b) => (a.order ?? 1e9) - (b.order ?? 1e9) || byName(a, b);
const itemOf = (type, id) => (type === 'folder' ? folder(id) : lib.notebooks.find(n => n.id === id));
const parentOf = (type, item) => (type === 'folder' ? item?.parentId : item?.folderId) ?? null;
const siblingsOf = (type, parentId) => (type === 'folder' ? lib.folders : lib.notebooks)
  .filter(x => parentOf(type, x) === parentId).sort(bySort);
// põe o item em parentId, antes de beforeId (null = no fim), e renumera os vizinhos
function placeItem(type, id, parentId, beforeId) {
  const item = itemOf(type, id);
  if (!item) return;
  if (type === 'folder') item.parentId = parentId; else item.folderId = parentId;
  const sibs = siblingsOf(type, parentId).filter(x => x.id !== id);
  let i = beforeId ? sibs.findIndex(x => x.id === beforeId) : -1;
  if (i < 0) i = sibs.length;
  sibs.splice(i, 0, item);
  sibs.forEach((x, k) => { x.order = k; });
}
// item novo entra no fim: fixa a ordem que os vizinhos já mostram e devolve a próxima posição
const nextOrder = (type, parentId) => {
  const sibs = siblingsOf(type, parentId);
  sibs.forEach((x, k) => { x.order = k; });
  return sibs.length;
};

function renderLib() {
  tree.replaceChildren(...renderLevel(null, 0));
  if (FV.id) renderFolderView();
}
function renderLevel(parentId, depth) {
  const out = [];
  for (const f of lib.folders.filter(f => (f.parentId ?? null) === parentId).sort(bySort)) {
    out.push(folderRow(f, depth));
    if (depth === 0 || f.open) out.push(...renderLevel(f.id, depth + 1));   // pasta do topo sempre aberta; subpastas pelo chevron
  }
  for (const n of lib.notebooks.filter(n => (n.folderId ?? null) === parentId).sort(bySort)) out.push(notebookRow(n, depth));
  return out;
}
function folderRow(f, depth) {
  const nested = depth > 0;      // só subpastas recolhem; a pasta do topo funciona como cabeçalho da lista
  return h('div', { class: 'row folder' + (nested ? ' nested' : ' top') + (lib.selectedFolder === f.id ? ' sel' : '') + (FV.id === f.id ? ' current' : ''), role: 'treeitem',
                    'aria-expanded': nested ? String(!!f.open) : null, style: `--d:${depth}` + (folderColor(f) ? `;--fc:${folderColor(f)}` : ''), draggable: 'true', 'data-type': 'folder', 'data-id': f.id },
    nested ? h('button', { class: 'chev-btn', type: 'button', 'aria-label': f.open ? `Recolher ${f.name}` : `Expandir ${f.name}`,
      onclick: () => { f.open = !f.open; renderLib(); saveSoon(); } }, svg('chev', 'i chev')) : '',
    h('button', { class: 'row-main', title: `Abrir a pasta ${f.name}`, 'aria-current': FV.id === f.id ? 'page' : null,
      onclick: () => openFolder(f.id),
      ondblclick: () => startRename('folder', f.id) },
      svg('folder', 'i ico'), h('span', { class: 'name' }, f.name)),
    h('button', { class: 'act', title: 'Cor da pasta', 'aria-label': `Cor da pasta ${f.name}`, 'aria-haspopup': 'menu',
      onclick: e => openColorMenu(f, e.currentTarget) }, svg('palette')),
    h('button', { class: 'act', title: 'Renomear', 'aria-label': `Renomear ${f.name}`, onclick: () => startRename('folder', f.id) }, svg('pencil')),
    h('button', { class: 'act', title: 'Excluir pasta', 'aria-label': `Excluir ${f.name}`, onclick: () => deleteFolder(f) }, svg('trash')));
}
function notebookRow(n, depth) {
  return h('div', { class: 'row notebook' + (n.id === lib.current ? ' current' : ''), role: 'treeitem',
                    style: `--d:${depth}`, draggable: 'true', 'data-type': 'notebook', 'data-id': n.id },
    h('button', { class: 'row-main', title: n.name, 'aria-current': n.id === lib.current ? 'true' : null,
      onclick: () => openNotebook(n.id), ondblclick: () => startRename('notebook', n.id) },
      h('span', { class: 'bullet', 'aria-hidden': 'true' }), h('span', { class: 'name' }, n.name)),
    h('button', { class: 'act', title: 'Renomear', 'aria-label': `Renomear ${n.name}`, onclick: () => startRename('notebook', n.id) }, svg('pencil')),
    h('button', { class: 'act', title: 'Excluir caderno', 'aria-label': `Excluir ${n.name}`, onclick: () => deleteNotebook(n) }, svg('trash')));
}

function startRename(type, id) {
  const row = tree.querySelector(`.row[data-id="${id}"]`);
  if (!row || row.querySelector('.rename')) return;
  const item = type === 'folder' ? folder(id) : lib.notebooks.find(n => n.id === id);
  const main = row.querySelector('.row-main');
  const input = h('input', { class: 'rename', value: item.name, 'aria-label': 'Novo nome' });
  main.hidden = true;
  row.querySelectorAll('.act').forEach(a => a.hidden = true);
  row.draggable = false;
  main.after(input);
  input.focus(); input.select();
  let done = false;
  const finish = ok => {
    if (done) return;
    done = true;
    if (ok && input.value.trim()) item.name = input.value.trim();
    renderLib(); updatePager(); saveSoon();
  };
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
}

const FOLDER_COLORS = [

  { id: 'yellow', label: 'Amarelo', hex: '#d4a017' },

const folderColor = f => FOLDER_COLORS.find(c => c.id === f?.color)?.hex || '';
function openColorMenu(f, anchor) {
  document.querySelector('.color-menu')?.remove();
  const close = (focus = true) => { menu.remove(); removeEventListener('pointerdown', outside, true); if (focus && anchor.isConnected) anchor.focus(); };
  const outside = e => { if (!menu.contains(e.target)) close(false); };
  const pick = id => {

    close(false); renderLib(); saveSoon();
  };
  const opt = (c) => h('button', { type: 'button', role: 'menuitemradio', class: c ? '' : 'cm-none', title: c ? c.label : 'Sem cor',
    'aria-label': c ? c.label : 'Sem cor', 'aria-checked': String((f.color || null) === (c?.id || null)), style: c ? `--c:${c.hex}` : null,
    onclick: () => pick(c?.id) }, h('span', { class: 'cm-dot' }));
  const menu = h('div', { class: 'imp-menu color-menu', role: 'menu', 'aria-label': `Cor da pasta ${f.name}` },
    h('div', { class: 'cm-label' }, 'Cor da pasta'),
    h('div', { class: 'cm-grid' }, opt(null), ...FOLDER_COLORS.map(opt)));
  menu.addEventListener('keydown', e => {
    const items = [...menu.querySelectorAll('button')];
    const i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'Tab') { e.preventDefault(); close(); }
    else if (['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(e.key)) {
      e.preventDefault();
      const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 5, ArrowUp: -5 }[e.key];
      items[(i + step + items.length) % items.length].focus();
    }
  });
  document.body.append(menu);
  const r = anchor.getBoundingClientRect(), m = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(r.left, innerWidth - m.width - 8)) + 'px';
  menu.style.top = (r.bottom + m.height + 8 > innerHeight ? r.top - m.height - 4 : r.bottom + 4) + 'px';
  (menu.querySelector('[aria-checked="true"]') || menu.querySelector('button')).focus();
  addEventListener('pointerdown', outside, true);
}

 *  Página da pasta: subpastas e cadernos como capinhas                *

const FV = { id: null };
const relTime = t => {
  if (!t) return '';
  const rtf = new Intl.RelativeTimeFormat('pt-BR', { numeric: 'auto' });

function setupLibrary() {
  $('newFolder').addEventListener('click', newFolder);
  $('newNotebook').addEventListener('click', newNotebook);
  // clicar no vazio da árvore tira a seleção de pasta (novos itens vão para a raiz)
  tree.addEventListener('click', e => {
    if (e.target === tree && lib.selectedFolder) { lib.selectedFolder = null; renderLib(); saveSoon(); }
  });

  /* arrastar: na borda de cima/baixo de um item, reordena; no meio de uma pasta, põe dentro dela */
  let drag = null;
  const targetOf = e => {
    const row = e.target.closest?.('.row');
    if (!row) return { mode: 'into', parent: null, row: null };      // vazio da árvore: vai para a raiz
    const { type, id } = row.dataset;
    const item = itemOf(type, id);
    const parent = parentOf(type, item);
    const y = (e.clientY - row.getBoundingClientRect().top) / row.offsetHeight;
    if (type === 'folder') {
      if (drag.type === 'notebook') return { mode: 'into', parent: id, row };
      if (y < 0.28) return { mode: 'before', parent, ref: id, row };
      if (y > 0.72 && !(item.open && lib.folders.some(f => f.parentId === id))) return { mode: 'after', parent, ref: id, row };
      return { mode: 'into', parent: id, row };
    }
    if (drag.type === 'notebook') return { mode: y < 0.5 ? 'before' : 'after', parent, ref: id, row };
    // pasta solta sobre um caderno: vai para a mesma pasta dele
    return { mode: 'into', parent, row: parent ? tree.querySelector(`.row[data-id="${parent}"]`) : null };
  };
  const valid = t => !!drag && t.ref !== drag.id &&
    !(drag.type === 'folder' && t.parent && descendants(drag.id).has(t.parent));
  const clearMarks = () => {
    tree.classList.remove('drop-root');
    tree.querySelectorAll('.drop, .drop-before, .drop-after').forEach(r => r.classList.remove('drop', 'drop-before', 'drop-after'));
  };
  const applyDrop = t => {
    if (t.mode === 'into') placeItem(drag.type, drag.id, t.parent, null);
    else if (t.mode === 'before') placeItem(drag.type, drag.id, t.parent, t.ref);
    else {
      const sibs = siblingsOf(drag.type, t.parent).filter(x => x.id !== drag.id);
      placeItem(drag.type, drag.id, t.parent, sibs[sibs.findIndex(x => x.id === t.ref) + 1]?.id ?? null);
    }
    if (t.parent) folder(t.parent).open = true;
    saveSoon();

  tree.addEventListener('keydown', e => {
    if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    const row = e.target.closest('.row');
    if (!row) return;
    e.preventDefault();
    const { type, id } = row.dataset;
    const parent = parentOf(type, itemOf(type, id));
    const sibs = siblingsOf(type, parent);
    const i = sibs.findIndex(x => x.id === id), j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= sibs.length) return;
    placeItem(type, id, parent, e.key === 'ArrowUp' ? sibs[j].id : sibs[j + 1]?.id ?? null);
    saveSoon();
    renderLib();
    tree.querySelector(`.row[data-id="${id}"] .row-main`)?.focus();
  });
  tree.addEventListener('dragstart', e => {
    const row = e.target.closest('.row');
    if (!row) return;
    drag = { type: row.dataset.type, id: row.dataset.id };
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', row.dataset.id);
  });
  tree.addEventListener('dragover', e => {
    if (!drag) return;
    const t = targetOf(e);
    if (!valid(t)) { clearMarks(); return; }
    e.preventDefault();
    clearMarks();
    if (!t.row) tree.classList.add('drop-root');
    else t.row.classList.add(t.mode === 'into' ? 'drop' : `drop-${t.mode}`);
  });
  tree.addEventListener('dragleave', e => { if (!tree.contains(e.relatedTarget)) clearMarks(); });
  tree.addEventListener('drop', e => {
    if (!drag) return;
    e.preventDefault();
    const t = targetOf(e);
    if (valid(t)) applyDrop(t);
    drag = null; clearMarks(); renderLib();
  });
  tree.addEventListener('dragend', () => { drag = null; clearMarks(); tree.querySelectorAll('.dragging').forEach(r => r.classList.remove('dragging')); });

  $('libBtn').addEventListener('click', () => { libEl.classList.add('open'); scrim.classList.add('open'); });
  scrim.addEventListener('click', closeDrawer);
}

function fitEmbed(f) {
  const v = viewOf(f);
  if (!f.isConnected || !v || !f.clientWidth) return;
  const lh = lhOf(v.editor);
  if (f.dataset.kind === 'video') f._frameH = f.clientWidth * 9 / 16;   // player 16:9
  const demo = f.dataset.kind !== 'code';
  if (demo && !f._frameH) return;                       // espera o exemplo informar a altura
  const pre = f.querySelector('.paste-code');
  let preH = 0;
  if (pre) {
    pre.style.height = 'auto';
    const cap = demo ? 12 * lh : (MM.lines - 3) * lh;
    preH = Math.min(pre.scrollHeight + 2, cap);
    pre.style.height = preH + 'px';
  }
  const lines = clamp(Math.ceil(((demo ? f._frameH : 0) + preH + 2 * figGap() * lh) / lh - 0.05), 3, MM.lines - 2);
  if (+f.dataset.lines !== lines) {
    f.dataset.lines = lines;
    sizeFigures(v.editor);
    if (v.isDoc) commitDoc(true); else request({ ink: true, media: true });
  }
}

      tr.remove();

    case 'colAdd':
      for (const r of rows) { const c = h('td', {}, h('br')); r.cells[ci] ? r.cells[ci].after(c) : r.append(c); }

      for (const r of rows) r.cells[ci]?.remove();

    case 'alignL': case 'alignC': case 'alignR': {

// Markdown em linha: negrito, itálico, riscado, código, links e [[cadernos]]
function mdInline(src) {
  const slots = [];
  const keep = html => `\u0000${slots.push(html) - 1}\u0000`;
  let s = src;
  s = s.replace(/`([^`]+)`/g, (_, c) => keep(`<code>${escHtml(c)}</code>`));
  s = s.replace(/\\([\\`*_{}\[\]()#+\-.!~|>])/g, (_, c) => keep(escHtml(c)));
  s = s.replace(/!\[([^\]]*)\]\(<?([^)\s>]+)>?(?:\s+"[^"]*")?\)/g, (_, alt, u) => {
    const url = /^https?:/i.test(u) ? safeUrl(u) : null;
    return keep(url ? `<a href="${escHtml(url)}">${escHtml(alt || 'imagem')}</a>` : escHtml(alt));
  });
  s = s.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (_, name, alias) =>
    keep(`<a href="#" data-wiki="${escHtml(name.trim())}">${escHtml((alias || name).trim())}</a>`));
  // [texto](<outro arquivo.md>) ou [texto](outro.md): vira link para o caderno com esse nome
  s = s.replace(/\[([^\]]+)\]\(<?([^)<>]+?\.(?:md|markdown))>?\)/gi, (_, t, u) => {
    if (/^[a-z]+:/i.test(u)) return _;
    let name = u.split('/').pop().replace(/\.(md|markdown)$/i, '');
    try { name = decodeURIComponent(name); } catch {}
    name = name.replace(/^\d+\s*-\s*/, '');
    return keep(`<a href="#" data-wiki="${escHtml(name)}">${escHtml(t.replace(/^\d+\s*-\s*/, ''))}</a>`);
  });
  s = escHtml(s);
  s = s.replace(/\[([^\]]+)\]\((?:&lt;)?([^)\s]+?)(?:&gt;)?(?:\s+&quot;[^)]*&quot;)?\)/g, (all, t, u) => {
    const url = safeUrl(u.replace(/&amp;/g, '&'));
    return url ? keep(`<a href="${escHtml(url)}">`) + t + keep('</a>') : t;
  });
  s = s.replace(/&lt;((?:https?:\/\/|mailto:)[^\s&]+)&gt;/g, (_, u) => { const url = safeUrl(u); return url ? keep(`<a href="${escHtml(url)}">${escHtml(u)}</a>`) : u; });
  s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*|__(?=\S)([\s\S]*?\S)__/g, (_, a, b) => `<b>${a ?? b}</b>`);
  s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<strike>$1</strike>');
  s = s.replace(/\*(?=\S)([^*]*?\S)\*/g, '<i>$1</i>');

  return s;
}

function splitRow(line) {
  let t = line.trim();
  if (t.startsWith('|')) t = t.slice(1);
  if (t.endsWith('|') && !t.endsWith('\\|')) t = t.slice(0, -1);

function findImport(src, ctx) {
  let p = src.split(/[?#]/)[0];
  try { p = decodeURIComponent(p); } catch {}
  const parts = (ctx.dir ? ctx.dir.split('/') : []).concat(p.replace(/^\.\//, '').split('/'));
  const out = [];
  for (const s of parts) { if (s === '..') out.pop(); else if (s && s !== '.') out.push(s); }
  const key = out.join('/').toLowerCase();
  if (ctx.files.has(key)) return ctx.files.get(key);
  const base = p.split('/').pop().toLowerCase();       // estilo Obsidian: só o nome do arquivo
  for (const [k, f] of ctx.files) if (k.split('/').pop() === base) return f;

async function importImage(src, alt, ctx) {
  let file = null;
  if (/^https?:/i.test(src)) {
    try {
      const res = await fetch(src, { mode: 'cors' });
      const blob = res.ok ? await res.blob() : null;
      if (blob && /^(image|video)\//.test(blob.type)) file = new File([blob], src.split('/').pop() || 'imagem', { type: blob.type });
    } catch {}
    if (!file) { const url = safeUrl(src); return url ? mdEl('p', `<a href="${escHtml(url)}">${escHtml(alt || 'imagem')}</a>`) : null; }
  } else {
    file = findImport(src, ctx);
    if (file && !file.type) {
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      const type = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', mp4: 'video/mp4', webm: 'video/webm' }[ext];

const LIST_RE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const FENCE_RE = /^\s*(`{3,}|~{3,})\s*([\w+#.-]*)/;

async function mdToHtml(text, ctx) {
  text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n').replace(/^---\n[\s\S]*?\n---[ \t]*(\n|$)/, '');
  const lines = text.split('\n');
  const out = document.createElement('div');

  const joinInline = ls => ls.map((l, k) => {
    const brk = k < ls.length - 1 && (/ {2,}$/.test(l) || /\\$/.test(l));
    return mdInline(l.replace(/\\$/, '').trim()) + (k < ls.length - 1 ? (brk ? '<br>' : ' ') : '');
  }).join('');
  const flush = () => { if (para.length) out.append(mdEl('p', joinInline(para))); para = []; };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim()) { flush(); continue; }
    let m;
    if ((m = line.match(FENCE_RE))) {                    // bloco de código
      flush();
      const fence = m[1], code = [];
      for (i++; i < lines.length && !lines[i].trim().startsWith(fence[0].repeat(fence.length)); i++) code.push(lines[i]);
      out.append(h('figure', { class: 'embed', 'data-kind': 'code', 'data-id': uid(), 'data-w': 100,
        'data-lines': clamp(code.length + 2, 3, MM.lines - 2), 'data-src': JSON.stringify({ code: code.join('\n') }) }));
      continue;
    }
    if ((m = line.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/))) { flush(); out.append(mdEl(`h${Math.min(4, m[1].length)}`, mdInline(m[2]))); continue; }

    if (para.length && /^\s*-{2,}\s*$/.test(line)) { out.append(mdEl('h2', joinInline(para))); para = []; continue; }
    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.append(h('hr')); continue; }
    if (line.includes('|') && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1]) && lines[i + 1].includes('-')) {
      flush();
      const aligns = splitRow(lines[i + 1]).map(c => (c.endsWith(':') ? (c.startsWith(':') ? 'center' : 'right') : ''));
      const rows = [splitRow(line)];
      for (i += 2; i < lines.length && lines[i].includes('|') && lines[i].trim(); i++) rows.push(splitRow(lines[i]));
      i--;
      const cols = Math.max(...rows.map(r => r.length));
      const body = h('tbody');
      for (const r of rows) body.append(h('tr', {}, ...Array.from({ length: cols }, (_, c) => {
        const td = mdEl('td', mdInline(r[c] || ''));
        if (aligns[c]) td.style.textAlign = aligns[c];
        return td;
      })));
      const t = h('table', { class: 'tbl', 'data-head': '1' });
      t.append(body);

    }
    if (/^\s*>/.test(line)) {                            // citação
      flush();
      const groups = [[]];
      for (; i < lines.length && /^\s*>/.test(lines[i]); i++) {
        const t = lines[i].replace(/^\s*>\s?/, '');
        if (!t.trim()) { if (groups[groups.length - 1].length) groups.push([]); } else groups[groups.length - 1].push(t);
      }
      i--;
      for (const g of groups) if (g.length) out.append(mdEl('blockquote', joinInline(g)));
      continue;
    }
    if ((m = line.match(LIST_RE))) {                     // listas (subníveis viram itens da mesma lista)
      flush();
      const ordered = /\d/.test(m[2]);
      const items = [];
      for (; i < lines.length; i++) {
        const l = lines[i];

          items.push([mm[3]]);
        } else if (l.trim() && /^\s{2,}\S/.test(l) && items.length) items[items.length - 1].push(l.trim());
        else if (!l.trim() && i + 1 < lines.length && LIST_RE.test(lines[i + 1]) && /\d/.test(lines[i + 1].match(LIST_RE)[2]) === ordered) continue;
        else break;
      }
      i--;

      let list = null, n0 = ordered ? Math.max(1, parseInt(m[2], 10) || 1) : 1;
      for (const it of items) {
        let t = it.join(' ');

        if (c && check) t = t.slice(c[0].length);

    }
    if ((m = line.match(/^\s*!\[([^\]]*)\]\(<?([^)\s>]+)>?(?:\s+"[^"]*")?\)\s*$/))) {   // imagem sozinha na linha
      flush();

      if (fig) out.append(fig);
      continue;
    }
    if ((m = line.match(/^\s*<?(https?:\/\/\S+?)>?\s*$/) || line.match(/^\s*\[[^\]]*\]\((https?:\/\/[^)\s]+)\)\s*$/)) && VIDEO_HOST.test(m[1])) {
      flush();
      out.append(videoFigure(m[1]));
      continue;
    }
    para.push(line);
  }
  flush();
  return out.innerHTML || EMPTY_PAGE;
}

// percorre o que foi arrastado do Windows (pastas inteiras ou arquivos soltos)
async function walkEntries(roots) {
  const out = [];
  const visit = async (entry, prefix) => {
    if (entry.name.startsWith('.')) return;            // .obsidian, .git…
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej)).catch(() => null);
      if (file) out.push({ path: prefix + entry.name, file });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((res, rej) => reader.readEntries(res, rej)).catch(() => []);
        if (!batch.length) break;
        for (const c of batch) await visit(c, prefix + entry.name + '/');
      }
    }
  };
  for (const r of roots) await visit(r, '');
  return out;
}

function ensureFolderPath(parentId, names) {
  let pid = parentId;
  for (const name of names) {
    let f = lib.folders.find(x => (x.parentId ?? null) === pid && x.name === name);
    if (!f) { f = { id: uid(), name, parentId: pid, open: false }; lib.folders.push(f); }
    pid = f.id;

}

async function importEntries(entries) {
  entries = entries.filter(e => !e.path.split('/').some(s => s.startsWith('.')));
  const mds = entries.filter(e => isMd(e.path)).sort((a, b) => a.path.localeCompare(b.path, 'pt-BR', { numeric: true }));
  if (!mds.length) { toast('Nenhum arquivo .md encontrado.'); return; }
  commitDoc();
  const dest = lib.selectedFolder && folder(lib.selectedFolder) ? lib.selectedFolder : null;
  const files = new Map(entries.map(e => [e.path.toLowerCase(), e.file]));
  const stats = { novos: 0, atualizados: 0, conflitos: 0, iguais: 0 };
  let firstNew = null, topFolder = null, done = 0;
  const reloadCurrent = new Set();
  for (const { path, file } of mds) {
    if (++done % 10 === 0) toast(`Importando… ${done} de ${mds.length}`);
    const parts = path.split('/');
    const name = parts.pop().replace(/\.(md|markdown)$/i, '');
    const text = await file.text().catch(() => null);
    if (text == null) continue;
    const hash = fileHash(text);
    const key = path;
    const ctx = { dir: parts.join('/'), files };
    const existing = lib.notebooks.find(n => n.source?.key === key);
    if (existing) {
      if (existing.source.hash === hash) { stats.iguais++; continue; }
      if (!existing.source.dirty) {
        existing.html = await mdToHtml(text, ctx);
        Object.assign(existing.source, { hash, importedAt: Date.now() });
        existing.updated = Date.now();
        stats.atualizados++;
        reloadCurrent.add(existing.id);
        continue;
      }
      // editado aqui e mudado no arquivo: a versão do arquivo fica ao lado
      const sib = lib.notebooks.find(n => n.source?.key === key + '#arquivo');
      if (sib && !sib.source.dirty) {
        if (sib.source.hash !== hash) {
          sib.html = await mdToHtml(text, ctx);
          Object.assign(sib.source, { hash, importedAt: Date.now() });
          sib.updated = Date.now();
          reloadCurrent.add(sib.id);
        }
      } else {
        lib.notebooks.push({ id: uid(), name: `${existing.name} (do arquivo)`, folderId: existing.folderId, html: await mdToHtml(text, ctx),
          editing: false, updated: Date.now(), source: { key: key + '#arquivo', hash, importedAt: Date.now(), dirty: false } });
      }

async function downloadBackup() {
  commitDoc();
  const libOut = { ...lib, notebooks: lib.notebooks.map(({ pages, ...n }) => n) };
  const ids = new Set();
  for (const n of lib.notebooks) for (const m of (n.html || '').matchAll(/data-media="([^"]+)"/g)) ids.add(m[1]);
  if (ids.size) toast(`Preparando backup com ${plural(ids.size, 'arquivo de mídia', 'arquivos de mídia')}…`);
  // montado em pedaços: arquivos grandes não viram uma string única gigante
  const parts = [`{"app":"delarry-estudos","version":2,"exportedAt":${JSON.stringify(new Date().toISOString())},"lib":${JSON.stringify(libOut)},"media":{`];
  let saved = 0, missing = 0;
  for (const id of ids) {
    const blob = memBlobs.get(id) || await Store.getMedia(id).catch(() => null);
    if (!blob) { missing++; continue; }
    const entry = { type: blob.type || '', name: blob.name || '', data: await blobToDataUrl(blob) };
    parts.push(`${saved ? ',' : ''}${JSON.stringify(id)}:${JSON.stringify(entry)}`);
    saved++;

  parts.push('}}');
  const url = URL.createObjectURL(new Blob(parts, { type: 'application/json' }));
  const a = h('a', { href: url, download: `delarry-estudos-backup-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`Backup com ${plural(lib.notebooks.length, 'caderno', 'cadernos')} e ${plural(saved, 'arquivo de mídia', 'arquivos de mídia')} baixado.` +
        (missing ? ` ${plural(missing, 'arquivo não estava', 'arquivos não estavam')} neste navegador.` : ''));
}
async function restoreBackup(text) {
  let data = null;
  try { data = JSON.parse(text); } catch {}
  const next = data?.lib;
  if (data?.app !== 'delarry-estudos' || next?.version !== 2 || !Array.isArray(next.folders) || !Array.isArray(next.notebooks)) {
    toast('Esse arquivo não é um backup do Delarry Estudos.');
    return;
  }
  // primeiro devolve as mídias ao navegador; backups antigos não têm essa parte
  const media = data.media && typeof data.media === 'object' ? Object.entries(data.media) : [];
  let restored = 0;
  if (media.length) toast(`Restaurando ${plural(media.length, 'arquivo de mídia', 'arquivos de mídia')}…`);
  for (const [id, m] of media) {
    if (!/^[\w-]+$/.test(id) || typeof m?.data !== 'string' || !m.data.startsWith('data:')) continue;
    try {
      let blob = await (await fetch(m.data)).blob();
      if (m.type && blob.type !== m.type) blob = new Blob([blob], { type: m.type });
      await Store.putMedia(id, blob);
      memBlobs.set(id, blob);
      if (mediaUrls.has(id)) { URL.revokeObjectURL(mediaUrls.get(id)); mediaUrls.delete(id); }
      mediaTypes.delete(id);
      animCache.delete(id);
      restored++;
    } catch (err) { console.warn('mídia do backup', id, err); }
  }
  closeBook();
  closeFolderView();
  withUndo(`Backup restaurado: ${plural(next.notebooks.length, 'caderno', 'cadernos')}` +
           (restored ? ` e ${plural(restored, 'arquivo de mídia', 'arquivos de mídia')}` : ''), () => {
    lib = next;
    ensureCurrent();
    renderLib();
    loadDoc();
  });
}

// minúsculas e sem acento, caractere a caractere (os índices batem com o texto original)
function fold(s) {
  let o = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    o += ((c.normalize('NFD')[0] || c).toLowerCase()[0] || c);
  }
  return o;
}
const textCache = new Map();
function pageText(html) {
  let t = textCache.get(html);
  if (t === undefined) {
    const d = document.createElement('div');
    d.innerHTML = html;
    t = [...d.children].map(b => b.textContent).join('  ').replace(/\s+/g, ' ').trim();
    if (textCache.size > 500) textCache.clear();
    textCache.set(html, t);
  }
  return t;
}
function snippet(text, i, len) {
  const a = Math.max(0, i - 48), b = Math.min(text.length, i + len + 64);
  return h('span', { class: 'result-snip' },
    (a > 0 ? '…' : '') + text.slice(a, i), h('mark', {}, text.slice(i, i + len)), text.slice(i + len, b) + (b < text.length ? '…' : ''));
}
function folderPath(id) {
  const names = [];
  for (let f = folder(id); f; f = folder(f.parentId)) names.unshift(f.name);
  return names.join(' / ');
}
function runSearch() {
  const q = $('search').value.trim();
  const fq = fold(q);
  const box = $('results');
  const searching = !!fq;
  box.hidden = !searching;
  tree.hidden = searching;
  if (!searching) { box.replaceChildren(); return; }
  commitPage();
  const out = [];
  for (const f of lib.folders) {
    if (fold(f.name).includes(fq)) out.push(h('button', { class: 'result', type: 'button', onclick: () => { $('search').value = ''; runSearch(); openFolder(f.id); } },
      h('span', { class: 'result-title' }, svg('folderSm'), f.name, h('span', { class: 'where' }, f.parentId ? folderPath(f.parentId) : 'pasta'))));
  }
  for (const n of lib.notebooks) {
    const where = n.folderId ? folderPath(n.folderId) : 'sem pasta';
    if (fold(n.name).includes(fq)) out.push(h('button', { class: 'result', type: 'button', onclick: () => openNotebook(n.id) },
      h('span', { class: 'result-title' }, svg('book'), n.name, h('span', { class: 'where' }, where))));
  }
  let hits = 0;
  outer: for (const n of lib.notebooks) {
    const t = pageText(n.html || '');
    const ft = fold(t);
    for (let i = ft.indexOf(fq), c = 0; i >= 0 && c < 3; i = ft.indexOf(fq, i + fq.length), c++) {
      const nth = c;
      out.push(h('button', { class: 'result', type: 'button', onclick: () => openHit(n.id, q, nth) },
        h('span', { class: 'result-title' }, svg('page'), n.name, h('span', { class: 'where' }, n.folderId ? folderPath(n.folderId) : 'sem pasta')),
        snippet(t, i, fq.length)));
      if (++hits >= 80) break outer;
    }
  }
  box.replaceChildren(
    h('div', { class: 'results-count' }, out.length ? `${out.length} resultado${out.length > 1 ? 's' : ''}` : ''),
    ...(out.length ? out : [h('div', { class: 'results-empty' }, `Nada encontrado para “${q}”.`)]));
}
function revealFolder(id) {

// resultado da pesquisa abre o texto (não o livro) com o trecho selecionado
function openHit(id, q, nth = 0) {

}
function revealMatch(q, nth = 0) {
  const fq = fold(q);
  const ed = docEl;
  const walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('.media, .embed, .audio') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  let seen = 0;
  for (let n; (n = walker.nextNode());) {
    let i = fold(n.data).indexOf(fq);
    while (i >= 0 && seen < nth) { seen++; i = fold(n.data).indexOf(fq, i + fq.length); }
    if (i < 0) continue;
    const r = document.createRange();
    r.setStart(n, i); r.setEnd(n, i + q.length);
    ed.focus({ preventScroll: true });
    getSelection().removeAllRanges(); getSelection().addRange(r);
    const rect = r.getBoundingClientRect();
    scrollBy({ top: rect.top - innerHeight / 2, behavior: reduceMotion ? 'auto' : 'smooth' });
    return;
  }
}

/* Unidades de fala na ordem da página: títulos, frases, itens de lista e notas, cada um separado.
   Texto riscado não é lido; fotos e exemplos são pulados. */
function speechUnits(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  for (const x of d.querySelectorAll('s, strike, del, figure, hr')) x.remove();
  const out = [];
  const push = (t, kind) => { t = t.replace(/\s+/g, ' ').trim(); if (t) out.push({ t, kind }); };
  for (const b of d.children) {
    const tag = b.tagName;
    if (/^H[1-6]$/.test(tag)) push(b.textContent, 'heading');
    else if (tag === 'UL' || tag === 'OL') for (const li of b.children) push((li.dataset.checked === 'true' ? 'Feito: ' : '') + li.textContent, 'item');
    else if (tag === 'TABLE') for (const tr of b.rows) push([...tr.cells].map(c => c.textContent.trim()).filter(Boolean).join(', '), 'item');
    else if (tag === 'NAV') continue;
    else for (const c of speechChunks(b.textContent)) push(c, tag === 'ASIDE' ? 'note' : 'text');
  }

}
const PAUSE = { heading: 450, item: 200, note: 250, text: 60 };
function speakNext(gen) {
  if (gen !== TTS.gen || !TTS.on) return;
  const unit = TTS.queue.shift();
  if (unit === undefined) { TTS.page++; setTimeout(() => speakPage(gen), 400); return; }
  const u = new SpeechSynthesisUtterance(unit.t);
  u.lang = 'pt-BR';
  const vo = pickVoice();
  if (vo) u.voice = vo;
  u.rate = V.ttsRate * (unit.kind === 'heading' ? 0.92 : 1);
  u.pitch = unit.kind === 'heading' ? 1.05 : unit.kind === 'note' ? 0.92 : 1;
  // uma fala termina uma vez só (o Chrome às vezes dispara erro e fim), senão a leitura corre em dobro
  let done = false;
  const next = () => { if (done) return; done = true; setTimeout(() => speakNext(gen), PAUSE[unit.kind] ?? 60); };
  u.onstart = () => markSpoken(unit.t);
  u.onend = next;
  u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') next(); };

}
// seleciona na folha a frase que está sendo lida
function markSpoken(t) {
  const v = TTS.doc ? DV : shownViews().find(x => x.page === TTS.page);
  if (!v) return;
  const probe = fold(t.slice(0, 48));
  const walker = document.createTreeWalker(v.editor, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('.media, .embed, .audio') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  for (let n; (n = walker.nextNode());) {
    const i = fold(n.data).indexOf(probe);
    if (i < 0) continue;
    const r = document.createRange();
    r.setStart(n, i); r.setEnd(n, Math.min(n.length, i + t.length));
    getSelection().removeAllRanges(); getSelection().addRange(r);
    const rect = r.getBoundingClientRect();
    if (rect.bottom > innerHeight - 90 || rect.top < 70) scrollBy({ top: rect.top - innerHeight / 3, behavior: 'smooth' });
    return;
  }
}

// cor de uma lâmpada pela temperatura (aprox. de Tanner Helland), normalizada no canal mais forte
function kelvinRGB(k) {
  const t = k / 100;
  let r, g, b;
  if (t <= 66) {
    r = 255;
    g = 99.4708025861 * Math.log(t) - 161.1195681661;
    b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  } else {
    r = 329.698727446 * Math.pow(t - 60, -0.1332047592);
    g = 288.1221695283 * Math.pow(t - 60, -0.0755148492);
    b = 255;
  }
  const c = [r, g, b].map(v => Math.pow(clamp(v, 1, 255) / 255, 0.8));
  const m = Math.max(...c);
  return c.map(v => v / m);
}

function setupView() {
  const panel = $('viewPanel'), body = panel.querySelector('.vp-body'), btn = $('viewBtn');
  const sync = [];

  const dial = (item, out) => {
    const el = h('div', { class: 'dial', role: 'slider', tabindex: '0', 'aria-label': 'Direção de onde vem a luz',

      <rect class="dial-sheet" x="27" y="23" width="18" height="26" rx="1.5"/>

    const knob = el.querySelector('.dial-knob'), ray = el.querySelector('.dial-ray');
    const show = deg => {
      const a = deg * Math.PI / 180, x = 36 + Math.cos(a) * 29, y = 36 + Math.sin(a) * 29;

      ray.setAttribute('x2', x); ray.setAttribute('y2', y);

      out.value = `${deg}°`;
    };
    const set = deg => { deg = ((Math.round(deg) % 360) + 360) % 360; show(deg); setView(item.key, deg); };
    const at = e => { const r = el.getBoundingClientRect(); set(Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI); };
    el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); at(e); });
