    if (as === os) out.push(...bc);
    else if (bs === os || as === bs) out.push(...ac);
    else { out.push(...ac, CONFLICT_NOTE, ...bc); conflict = true; }
  };
  for (let k = 0; k <= o.length; k++) {
    const anchor = k === o.length || (ma[k] >= ia && mb[k] >= ib);
    if (!anchor) continue;
    const ea = k === o.length ? a.length : ma[k], eb = k === o.length ? b.length : mb[k];
    chunk(o.slice(io, k), a.slice(ia, ea), b.slice(ib, eb));
    if (k < o.length) out.push(o[k]);
    io = k + 1; ia = ea + 1; ib = eb + 1;
  }
  return { html: out.join('') || EMPTY_PAGE, conflict };
}

const Sync = (() => {
  let sb = null, user = null, timer = 0, running = null, again = false, state = 'off', lastError = '';
  const listeners = new Set();
  const setState = s => { state = s; listeners.forEach(f => f()); };
  const baseKey = () => `syncBase:${user.id}`, mediaKey = () => `syncMedia:${user.id}`;

  // o que conta como "conteúdo" de cada item (o resto é estado da tela)
  const pickNb = n => ({ name: n.name, folderId: n.folderId ?? null, order: n.order ?? null, html: n.html || '', editing: !!n.editing, source: n.source ?? null });
  const pickFd = f => ({ name: f.name, parentId: f.parentId ?? null, order: f.order ?? null, open: !!f.open, color: f.color ?? null });
  const fromNbRow = r => ({ name: r.name, folderId: r.folder_id, order: r.order, html: r.html, editing: r.editing, source: r.source });
  const fromFdRow = r => ({ name: r.name, parentId: r.parent_id, order: r.order, open: r.open, color: r.color ?? null });
  const toNbRow = (id, d, stamp, deleted = false) => ({ user_id: user.id, id, name: d?.name ?? '', folder_id: d?.folderId ?? null, order: d?.order ?? null,
    html: d?.html ?? '', editing: !!d?.editing, source: d?.source ?? null, updated: stamp, deleted });
  const toFdRow = (id, d, stamp, deleted = false) => ({ user_id: user.id, id, name: d?.name ?? '', parent_id: d?.parentId ?? null, order: d?.order ?? null,
    open: !!d?.open, color: d?.color ?? null, updated: stamp, deleted });
  const same = (x, y) => JSON.stringify(x ?? null) === JSON.stringify(y ?? null);
  // o caderno de exemplo, do jeito que veio (compara só o texto, que não muda ao salvar)
  const plain = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent.replace(/\s+/g, ' ').trim(); };
  const EXAMPLE_TEXT = plain(DEFAULT_HTML);
  const isUntouchedExample = n => plain(n.html) === EXAMPLE_TEXT;

  async function load() {
    if (sb) return sb;
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm');
    sb = createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' } });
    return sb;
  }

  async function syncOnce() {
    if (!user || !navigator.onLine) { setState(user ? 'offline' : 'off'); return; }
    setState('syncing');
    commitDoc();
    const [fRes, nRes] = await Promise.all([
      sb.from('folders').select('*').eq('user_id', user.id),
      sb.from('notebooks').select('*').eq('user_id', user.id),
    ]);
    if (fRes.error || nRes.error) throw fRes.error || nRes.error;
    const base = (await Store.getKV(baseKey()).catch(() => null)) || { folders: {}, notebooks: {} };
    const remoteHasNotes = nRes.data.some(r => !r.deleted);
    const firstSync = !Object.keys(base.notebooks).length && !Object.keys(base.folders).length;

    // aparelho novo entrando numa conta com cadernos: o exemplo intocado sai do caminho
    if (firstSync && remoteHasNotes) {
      const ex = lib.notebooks.filter(isUntouchedExample);
      lib.notebooks = lib.notebooks.filter(n => !isUntouchedExample(n));
      for (const n of ex) {
        const f = folder(n.folderId);
        if (f && !lib.notebooks.some(x => x.folderId === f.id) && !lib.folders.some(x => x.parentId === f.id)) lib.folders = lib.folders.filter(x => x !== f);
      }
    }

    let changedLocal = false, conflicts = 0;
    const touchedCurrent = { v: false };
    const push = { folders: [], notebooks: [] };
    const syncType = (type, remoteRows) => {
      const isNb = type === 'notebooks';
      const list = isNb ? lib.notebooks : lib.folders;
      const pick = isNb ? pickNb : pickFd, fromRow = isNb ? fromNbRow : fromFdRow, toRow = isNb ? toNbRow : toFdRow;
      const B = base[type];
      const local = new Map(list.map(x => [x.id, x]));
      const remote = new Map(remoteRows.map(r => [r.id, r]));
      const ids = new Set([...local.keys(), ...remote.keys(), ...Object.keys(B)]);
      for (const id of ids) {
        const L = local.get(id), R = remote.get(id), b = B[id];
        // o exemplo e a pasta dele só sobem se a pessoa mexeu
        if (isNb && L && !b && !R && isUntouchedExample(L)) continue;
        if (!isNb && L && !b && !R && L.name === 'Pessoal' && lib.notebooks.filter(n => n.folderId === id).every(isUntouchedExample) && !lib.folders.some(f => f.parentId === id)) continue;
        const Ld = L ? pick(L) : null;
        const Rd = R && !R.deleted ? fromRow(R) : null;
        const lc = !same(Ld, b?.data ?? null);
        const rc = R ? R.updated !== b?.stamp : false;
        if (!lc && !rc) continue;
        let final, pushIt = false;
        if (lc && !rc) { final = Ld; pushIt = true; }
        else if (!lc && rc) { final = Rd; }
        else if (Ld && Rd) {
          if (isNb && Ld.html !== Rd.html) {
            const m = merge3(b?.data?.html ?? '', Ld.html, Rd.html);
            if (m.conflict) conflicts++;
            final = { ...Rd, html: m.html };
          } else final = { ...Rd };
          // nome, pasta e ordem: vale a mudança mais recente (a local é a de agora)
          for (const k of Object.keys(Ld)) if (k !== 'html' && !same(Ld[k], b?.data?.[k])) final[k] = Ld[k];
          pushIt = true;
        } else { final = Ld || Rd; pushIt = !!Ld; }   // um lado apagou e o outro editou: fica o editado
        // aplica no aparelho
        if (!same(final, Ld)) {
          changedLocal = true;
          if (id === lib.current) touchedCurrent.v = true;
          if (!final) list.splice(list.indexOf(L), 1);
          else if (L) Object.assign(L, final);
          else list.push({ id, ...final, ...(isNb ? { updated: R?.updated || Date.now() } : {}) });
        }
        const stamp = pushIt ? Date.now() : R?.updated ?? b?.stamp ?? 0;
        if (pushIt) push[type].push(toRow(id, final, stamp, !final));
        if (final || R) B[id] = { stamp, data: final }; else delete B[id];
      }
    };
    syncType('folders', fRes.data);
    syncType('notebooks', nRes.data);

    for (const [table, rows] of Object.entries(push)) {
      for (let i = 0; i < rows.length; i += 200) {
        let { error } = await sb.from(table).upsert(rows.slice(i, i + 200), { onConflict: 'user_id,id' });
        // banco ainda sem a coluna de cor (schema.sql antigo): sobe o resto sem ela
        if (error && table === 'folders' && /color/.test(error.message || '')) {
          ({ error } = await sb.from(table).upsert(rows.slice(i, i + 200).map(({ color, ...r }) => r), { onConflict: 'user_id,id' }));
        }
        if (error) throw error;
      }
    }
    await Store.putKV(baseKey(), base);

    if (changedLocal) {
      ensureCurrent();
      Store.putLib(lib).catch(console.error);
      renderLib();
      if (touchedCurrent.v && !BOOK.open) loadDoc({ keepScroll: true });
    }
    if (conflicts) toast(`${plural(conflicts, 'caderno foi editado', 'cadernos foram editados')} em dois aparelhos: as duas versões ficaram no texto, marcadas.`);
    await uploadMedia();
    setState('ok');
  }

  // sobe as mídias usadas nos cadernos que ainda não estão na conta
  let quotaWarned = false;
  async function uploadMedia() {
    const done = new Set((await Store.getKV(mediaKey()).catch(() => null)) || []);
    const ids = new Set();
    for (const n of lib.notebooks) for (const m of (n.html || '').matchAll(/data-media="([^"]+)"/g)) ids.add(m[1]);
    let used = null;
    for (const id of ids) {
      if (done.has(id)) continue;
      const blob = memBlobs.get(id) || await Store.getMedia(id).catch(() => null);
      if (!blob) continue;
      if (blob.size > MEDIA_MAX) { done.add(id); toast(`Um arquivo passou de 20 MB e ficou só neste aparelho.`); continue; }
      if (used === null) used = await mediaUsed();
      if (used + blob.size > MEDIA_QUOTA) {
        if (!quotaWarned) toast(`Seu espaço de mídia está cheio (${fmtMB(used)} de ${fmtMB(MEDIA_QUOTA)}). Os arquivos novos ficam só neste aparelho.`);
        quotaWarned = true;
        break;
      }
      const { error } = await sb.storage.from('media').upload(`${user.id}/${id}`, blob, { contentType: blob.type || 'application/octet-stream', upsert: false });
      if (error && !/exist|duplicate/i.test(error.message || '')) { console.warn('mídia', id, error); continue; }
      done.add(id);
      used += blob.size;
    }
    await Store.putKV(mediaKey(), [...done]);
  }
  async function mediaUsed() {
    const { data, error } = await sb.rpc('media_used');
    return error ? 0 : Number(data) || 0;
  }

  const api = {
    get user() { return user; },
    get state() { return state; },
    get lastError() { return lastError; },
    onChange: f => listeners.add(f),
    async init() {
      try {
        await load();
        const { data } = await sb.auth.getSession();
        user = data.session?.user || null;
        sb.auth.onAuthStateChange((event, session) => {
          const was = user?.id;
          user = session?.user || null;
          if (user && user.id !== was) { setState('syncing'); api.now(); }
          if (!user) setState('off');
          listeners.forEach(f => f());
        });
        setState(user ? 'syncing' : 'off');
        if (user) api.now();
      } catch (err) { console.warn('conta indisponível', err); setState('unavailable'); }
    },
    schedule(ms = 4000) {
      if (!user) return;
      clearTimeout(timer);
      timer = setTimeout(() => api.now(), ms);
    },
    async now() {
      if (!user) return false;
      if (running) { again = true; return running; }
      running = (async () => {
        try { await syncOnce(); lastError = ''; return true; }
        catch (err) { console.warn('sincronização', err); lastError = err?.message || String(err); setState(navigator.onLine ? 'error' : 'offline'); return false; }
        finally { running = null; if (again) { again = false; api.schedule(500); } }
      })();
      return running;
    },
    async fetchMedia(id) {
      if (!user || !sb) return null;
      const { data, error } = await sb.storage.from('media').download(`${user.id}/${id}`);
      if (error || !data) return null;
      memBlobs.set(id, data);
      Store.putMedia(id, data).catch(() => {});
      const done = new Set((await Store.getKV(mediaKey()).catch(() => null)) || []);
      done.add(id);
      Store.putKV(mediaKey(), [...done]).catch(() => {});
      return data;
    },
    mediaUsed: () => (user ? mediaUsed() : Promise.resolve(0)),
    async signInGoogle() {
      await load();
      const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectUrl() } });
      if (error) toast(`Não deu para entrar com o Google: ${error.message}`);
    },
    async signInEmail(email) {
      await load();
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectUrl() } });
      if (error) { toast(`Não deu para enviar o link: ${error.message}`); return false; }
      return true;
    },
    async signOut() {
      if (user && !(await api.now())) {
        toast('Sem conexão: suas últimas mudanças ainda não foram para a conta. Conecte-se e tente sair de novo.');
        return false;
      }
      // sair só desconecta: pastas e cadernos continuam neste aparelho
      await sb.auth.signOut();
      return true;
    },
    async deleteAccount() {
      if (!user) return false;
      // apaga as mídias da conta, depois a conta (pastas e cadernos vão junto)
      for (;;) {
        const { data, error } = await sb.storage.from('media').list(user.id, { limit: 1000 });
        if (error || !data?.length) break;
        const { error: e2 } = await sb.storage.from('media').remove(data.map(f => `${user.id}/${f.name}`));
        if (e2) break;
      }
      const { error } = await sb.rpc('delete_my_account');
      if (error) { toast(`Não deu para excluir a conta: ${error.message}`); return false; }
      await sb.auth.signOut().catch(() => {});
      await wipeDevice();
      return true;
    },
  };
  // aberto direto do arquivo (file://) não recebe o retorno do login: volta para o site
  const redirectUrl = () => (location.protocol.startsWith('http') ? location.origin + location.pathname : SITE_URL);
  async function wipeDevice() {
    closeBook();
    closeFolderView();
    await Store.wipe().catch(console.error);
    memBlobs.clear();
    for (const u of mediaUrls.values()) URL.revokeObjectURL(u);
    mediaUrls.clear();
    lib = defaultLibrary();
    await Store.putLib(lib).catch(() => {});
    renderLib();
    loadDoc();
  }
  return api;
})();
const fmtMB = b => `${(b / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: b < 10485760 ? 1 : 0 })} MB`;

/* Menu da conta, no topo da biblioteca */
function setupAccount() {
  const btn = $('acctBtn'), menu = $('acctMenu');
  const face = btn.querySelector('.acct-face');
  // sem foto: silhueta; com conta e sem foto: inicial do nome
  const SILHOUETTE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="4.2" fill="currentColor"/><path d="M3.5 21.5c1.4-4 4.7-6 8.5-6s7.1 2 8.5 6" fill="currentColor"/></svg>';
  const STATE_TEXT = { ok: 'Tudo sincronizado', syncing: 'Sincronizando…', offline: 'Sem internet: as mudanças sobem quando voltar', error: 'Não deu para sincronizar agora', off: '', unavailable: 'Conta indisponível agora' };
  const paint = () => {
    const u = Sync.user;
    btn.dataset.state = u ? Sync.state : 'off';
    const nameOf = x => x?.user_metadata?.full_name || x?.user_metadata?.name || x?.email || '';
    const photo = u?.user_metadata?.avatar_url || u?.user_metadata?.picture;
    if (photo) face.replaceChildren(h('img', { src: photo, alt: '', referrerpolicy: 'no-referrer' }));
    else if (u) face.textContent = (nameOf(u).trim()[0] || '?').toUpperCase();
    else face.innerHTML = SILHOUETTE;
    btn.classList.toggle('in', !!u);
    btn.title = u ? `${nameOf(u)} · ${STATE_TEXT[Sync.state] || ''}` : 'Entrar para sincronizar seus cadernos';
    if (!menu.hidden) render();
  };
  Sync.onChange(paint);
  paint();

  let confirmDelete = false;
  const render = async () => {
    const u = Sync.user;
    if (!u) {
      const sent = menu.dataset.sent;
      menu.replaceChildren(
        h('h2', { class: 'am-title' }, 'Seus cadernos em qualquer aparelho'),
        h('p', { class: 'am-text' }, 'Entre para ver e editar seus cadernos no computador e no celular. Sem conta, tudo continua salvo só neste navegador.'),
        location.protocol === 'file:' ? h('p', { class: 'am-note' }, 'Aberto direto do arquivo, o login volta para o site. Para usar sua conta, abra ', h('a', { href: SITE_URL, target: '_blank', rel: 'noopener' }, 'o site do Delarry Estudos'), '.') : '',
        h('button', { type: 'button', class: 'am-google', onclick: () => Sync.signInGoogle() },
          h('span', { class: 'am-g', 'aria-hidden': 'true' }, 'G'), 'Entrar com Google'),
        h('div', { class: 'am-or' }, h('span', {}, 'ou')),
        sent
          ? h('p', { class: 'am-sent' }, `Enviamos um link de acesso para ${sent}. Abra o e-mail neste aparelho e clique no link.`)
          : h('form', { class: 'am-form', onsubmit: async e => {
              e.preventDefault();
              const email = e.target.email.value.trim();
              if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { e.target.email.setAttribute('aria-invalid', 'true'); e.target.email.focus(); return; }
              e.target.querySelector('button').disabled = true;
              if (await Sync.signInEmail(email)) { menu.dataset.sent = email; render(); }
              else e.target.querySelector('button').disabled = false;
            } },
            h('label', { class: 'am-label' }, 'Seu e-mail', h('input', { name: 'email', type: 'email', autocomplete: 'email', placeholder: 'voce@exemplo.com', required: true })),
            h('button', { type: 'submit', class: 'btn primary am-send' }, 'Enviar link de acesso')),
        h('p', { class: 'am-legal' }, 'Ao entrar, você concorda com a ', h('a', { href: 'privacidade.html', target: '_blank', rel: 'noopener' }, 'política de privacidade'), '.'));
      return;
    }
    const name = u.user_metadata?.full_name || u.user_metadata?.name || '';
    const usage = h('div', { class: 'am-usage' }, h('div', { class: 'am-usage-text' }, 'Espaço de mídia: calculando…'), h('div', { class: 'am-bar' }, h('span')));
    const kids = [
      h('div', { class: 'am-who' },
        h('span', { class: 'am-avatar', 'aria-hidden': 'true' }, (u.user_metadata?.avatar_url || u.user_metadata?.picture)
          ? h('img', { src: u.user_metadata.avatar_url || u.user_metadata.picture, alt: '', referrerpolicy: 'no-referrer' })
          : (name || u.email || '?').trim()[0].toUpperCase()),
        h('div', {}, name ? h('div', { class: 'am-name' }, name) : '', h('div', { class: 'am-email' }, u.email || ''))),
      h('p', { class: 'am-status', 'data-state': Sync.state }, STATE_TEXT[Sync.state] || '',
        Sync.state === 'error' && Sync.lastError ? h('small', { class: 'am-err' }, Sync.lastError) : ''),
      usage,
      h('button', { type: 'button', class: 'am-item', onclick: () => Sync.now() }, 'Sincronizar agora'),
      h('button', { type: 'button', class: 'am-item', onclick: async () => { if (await Sync.signOut()) { open(false); toast('Você saiu da conta. Os cadernos continuam aqui e na conta.'); } } }, 'Sair'),
    ];
    if (!confirmDelete) {
      kids.push(h('button', { type: 'button', class: 'am-item am-danger', onclick: () => { confirmDelete = true; render(); } }, 'Excluir minha conta'));
    } else {
      // a única exclusão sem desfazer do app: pede para digitar "excluir"
      const input = h('input', { type: 'text', autocomplete: 'off', 'aria-label': 'Digite excluir para confirmar' });
      kids.push(h('div', { class: 'am-delete' },
        h('p', {}, 'Isso apaga a conta, todos os cadernos e as mídias guardadas nela. Não dá para desfazer.'),
        h('button', { type: 'button', class: 'btn am-backup', onclick: () => downloadBackup() }, 'Baixar backup antes'),
        h('label', { class: 'am-label' }, 'Para confirmar, digite excluir', input),
        h('div', { class: 'am-row' },
          h('button', { type: 'button', class: 'btn', onclick: () => { confirmDelete = false; render(); } }, 'Cancelar'),
          h('button', { type: 'button', class: 'btn am-confirm', onclick: async e => {
            if (input.value.trim().toLowerCase() !== 'excluir') { input.setAttribute('aria-invalid', 'true'); input.focus(); return; }
            e.target.disabled = true;
            if (await Sync.deleteAccount()) { confirmDelete = false; open(false); toast('Sua conta e seus dados foram excluídos.'); }
            else e.target.disabled = false;
          } }, 'Excluir conta'))));
    }
    kids.push(h('p', { class: 'am-legal' }, h('a', { href: 'privacidade.html', target: '_blank', rel: 'noopener' }, 'Política de privacidade')));
    menu.replaceChildren(...kids);
    const used = await Sync.mediaUsed();
    usage.firstChild.textContent = `Espaço de mídia: ${fmtMB(used)} de ${fmtMB(MEDIA_QUOTA)}`;
    usage.querySelector('span').style.width = Math.min(100, used / MEDIA_QUOTA * 100) + '%';
  };
  const open = on => {
    menu.hidden = !on;
    btn.setAttribute('aria-expanded', String(on));
    if (!on) { confirmDelete = false; delete menu.dataset.sent; return; }
    render();
    const r = btn.getBoundingClientRect();
    menu.style.top = r.bottom + 8 + 'px';
    menu.style.left = clamp(r.right - menu.offsetWidth, 8, innerWidth - menu.offsetWidth - 8) + 'px';
  };
  btn.addEventListener('click', () => open(menu.hidden));
  addEventListener('pointerdown', e => { if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) open(false); });
  menu.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); open(false); btn.focus(); } });

  // quando sincronizar: ao voltar para a aba, ao voltar a internet e a cada minuto
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.schedule(300); });
  addEventListener('online', () => Sync.schedule(300));
  addEventListener('offline', () => Sync.user && paint());
  setInterval(() => { if (document.visibilityState === 'visible') Sync.schedule(0); }, 60000);
  Sync.init();
}

    ]);
  } catch {}

  await Store.init();
  let hasLocal = false;
  try { hasLocal = !!localStorage.getItem(VIEW_KEY); } catch {}
  if (!hasLocal) {
    const saved = await Store.getKV('view').catch(() => null);
    if (saved) {
      Object.assign(V, migrateView(saved));
      applyGrid();
      await loadFont().catch(() => {});
      metricsCache.clear();
      G = measureSheet();
    }
  }
  lib = await Store.getLib().catch(() => null);
  if (lib?.version !== 2) lib = defaultLibrary();
  ensureCurrent();

  setupEditor();
  setupPager();
  setupLibrary();
  setupView();
  setupSearch();
  setupSlash();
  setupCodeModal();
  setupLinks();
  setupFolderView();
  setupBlockSel();
  setupTables();
  setupImport();
  setupAccount();
  renderLib();
  loadDoc();
  Store.putLib(lib).catch(console.error);

  // apaga arquivos de mídia que nenhum texto usa mais
  Store.mediaKeys().then(keys => {
    if (!keys?.length) return;
    const used = new Set();
    for (const n of lib.notebooks) for (const m of (n.html || '').matchAll(/data-media="([^"]+)"/g)) used.add(m[1]);
    for (const k of keys) if (!used.has(k) && !memBlobs.has(k)) Store.delMedia(k).catch(() => {});
  }).catch(() => {});

  let rt;
  let chars = effChars();
  addEventListener('resize', () => {
    cancelAnimationFrame(rt);
    rt = requestAnimationFrame(() => {
      if (effChars() !== chars) { chars = effChars(); applyLayoutView(); }   // virou celular/desktop: remede (e remonta o livro)
      else { layoutDoc(); request({ layout: true }); }
    });
  });
  document.fonts.addEventListener?.('loadingdone', () => { metricsCache.clear(); layoutDoc(); request({ layout: true }); });
  addEventListener('pagehide', () => { commitDoc(); Store.putLib(lib).catch(() => {}); });

  // o abajur acompanha o cursor (ligado no painel); ao sair da janela, volta para a posição configurada
  addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' || !V.sway || !S || !BOOK.open) return;
    const r = PV[0].sheet.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) / S.pxmmCss;
    mouse.y = (e.clientY - r.top) / S.pxmmCss;
    mouse.in = true;
    request();
  });
  document.documentElement.addEventListener('pointerleave', () => { mouse.in = false; request(); });
  addEventListener('blur', () => { mouse.in = false; request(); });
  canvas.addEventListener('webglcontextlost', e => e.preventDefault());
  canvas.addEventListener('webglcontextrestored', () => { R = initGL(); request({ layout: true }); });

  console.info(`[folha] máx. ${G.w.toFixed(0)}×${G.h.toFixed(0)} px · coluna ${(V.chars * G.avg).toFixed(0)} px ` +
    `(${V.chars} × ${G.avg.toFixed(2)} px, ${V.font} ${V.fontSize}px)`);
}
start();
</script>
</body>
</html>
